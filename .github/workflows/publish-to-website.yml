# Publish to the website.
#
# The website's source is index.src.html. The page visitors get, index.html with assets/, is built from it here
# (tools/build.mjs compiles the page's code and styles ahead of time, so the site opens fast) and is kept on main only.
#
#   - Every change pushed to a claude/... branch goes live: the branch is merged into main, the page is built, and
#     GitHub Pages publishes main (in about two minutes).
#   - A change made directly on main (index.src.html edited on github.com, say) is built and published the same way.
#   - A branch that conflicts with main is not merged, and a page that does not build is not published: main stays as
#     it is, the website stays as it was, and the run shows what went wrong.
#
# To stop publishing automatically, disable this workflow in the repository's Actions tab. Do not delete it: without
# it index.html is no longer rebuilt, and the website stays as it was last built whatever the source says.
name: Publish to the website

on:
  push:
    branches: ["claude/**", "main"]

permissions:
  contents: write   # to merge the branch into main and add the built page; the push to main makes GitHub Pages rebuild the site

concurrency:
  group: publish-to-website
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the branch into main
        if: github.ref_name != 'main'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "main already has every change on $BRANCH"
          else
            git merge --no-ff --no-edit -m "Publish $BRANCH to the website" "origin/$BRANCH"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the page from its source
        run: |
          npm ci
          npm run build

      - name: Publish main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html and assets/ are ignored on working branches (.gitignore) and kept on main: hence --force.
          # --all also takes away what the build no longer makes (an earlier build's files in assets/).
          git add --force --all -- index.html assets
          if git diff --cached --quiet; then
            echo "the built page has not changed"
          else
            git commit --quiet -m "Build the website from index.src.html"
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "main is already up to date: nothing to publish"
          else
            git push origin HEAD:main
          fi
