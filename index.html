  /* ── geometry: boxes and panels, gathered into one buffer per material ──
     Everything is tagged with the gallery it stands in (0 kitchen, 1
     sanitary). Each gallery is lit by its own lights, so the partition
     between them stops light the way a wall does.                        */
  const makeBuilder = (K) => {
    const batches = new Map();
    const b = { zone: 0, batches };
    const put = (mat, p, n, t) => {
      const key = mat + "|" + b.zone;
      let a = batches.get(key); if (!a) batches.set(key, (a = []));
      a.push(p[0], p[1], p[2], n[0], n[1], n[2], t[0], t[1]);

       The winding is put right here, from the normal, so no caller has to. */
    b.face = (mat, a, bb, c, d, n, uv) => {
      if (dot(cross(sub(bb, a), sub(c, a)), n) < 0) { const t = bb; bb = d; d = t; }
      const A = uv(a), B = uv(bb), C = uv(c), D = uv(d);
      put(mat, a, n, A); put(mat, bb, n, B); put(mat, c, n, C); put(mat, a, n, A); put(mat, c, n, C); put(mat, d, n, D);
    };

  /* ── the room ─────────────────────────────────────────────────────────────

  const W = 7, D = 26, H = 3.6, PART = -13, OPEN = 1.5, LINTEL = 2.7, EYE = 1.62, IZ = -8.4;

  const PLACES = {

    lobby: [

    washes.push({ a: [-W, H - 0.01, -D + 0.04], b: [W, H - 0.01, -D + 0.04], color: WARM, power: 1, zone: 1 });
    decals.push({ kind: "foot", axis: "z", at: -D, a: -W, b: W, dir: 1 });
    if (o.hall) { solid(-W - 0.25, -D - 1, -W, DOP0 - 0.012); solid(-W - 0.25, DOP1 + 0.012, -W, 1); solid(-W - 0.25, DOP0, -W, DOP1, H, LINTEL); }
    else solid(-W - 1, -D - 1, -W, 1);
    solid(-W, -D - 1, W, -D); solid(-W, 0, W, 1);
    if (o.wing) { solid(W, -D - 1, W + 0.25, GOP0 - 0.012); solid(W, GOP1 + 0.012, W + 0.25, 1); solid(W, GOP0, W + 0.25, GOP1, H, LINTEL); }
    else solid(W, -D - 1, W + 1, 1);

    /* A partition between two rooms, at `at`, open in the middle `open` either side of x = 0: each face belongs to
       the room it faces — `front` the one at greater z, `back` the other — and each carries the name of the room
       through the opening, above it. The opening is lined in brushed metal: the one frame between two rooms.  */
    const partition = (at, open, front, back, signFront, signBack) => {
      for (const zone of [front, back]) {
        b.zone = zone;
        const isBack = zone === back, za = isBack ? at - 0.15 : at, zb = isBack ? at : at + 0.15, sk = isBack ? "+z" : "-z";
        b.box("plaster", -W, 0, za, -open, H, zb, { skip: sk + "-y+y-x+x" });
        b.box("plaster", open, 0, za, W, H, zb, { skip: sk + "-y+y+x-x" });
        b.box("plaster", -open, LINTEL, za, open, H, zb, { skip: sk + "+y-x+x" });
        b.box("brass", -open - 0.012, 0, za, -open, LINTEL, zb, { skip: sk + "-x-y" });
        b.box("brass", open, 0, za, open + 0.012, LINTEL, zb, { skip: sk + "+x-y" });
        b.box("brass", -open - 0.012, LINTEL - 0.012, za, open + 0.012, LINTEL, zb, { skip: sk + "+y" });
        const dz = isBack ? -1 : 1, zf = isBack ? at - 0.15 : at + 0.15;
        decals.push({ kind: "foot", axis: "z", at: zf, a: -W, b: -open - 0.012, dir: dz }, { kind: "foot", axis: "z", at: zf, a: open + 0.012, b: W, dir: dz });
        /* the partition is washed from above as well, either side of the opening */
        washes.push({ a: [-W, H - 0.01, zf + dz * 0.04], b: [W, H - 0.01, zf + dz * 0.04], color: zone === 0 ? T.light : WARM, power: zone === 0 ? 0.8 * T.power : 0.7, zone, zones: zone === 0 ? NEAR_ISLAND : null });
        b.box(zone === 0 ? T.strip : "emit", -W, H - 0.003, Math.min(zf + dz * 0.02, zf + dz * 0.05), W, H, Math.max(zf + dz * 0.02, zf + dz * 0.05), { skip: "+y" });
        b.panel(isBack ? signBack : signFront, [0, 3.08, zf + dz * 0.003], isBack ? [-1, 0, 0] : [1, 0, 0], [0, 1, 0], open > 1.8 ? 2.8 : 2.4, open > 1.8 ? 0.35 : 0.3);
      }
      solid(-W, at - 0.15, -open - 0.012, at + 0.15); solid(open + 0.012, at - 0.15, W, at + 0.15);
      solid(-open, at - 0.15, open, at + 0.15, H, LINTEL);
    };
    /* between the granite room and the Sanitary Gallery; between the lobby and the granite room */
    partition(PART, OPEN, 0, 1, "sign:0", "sign:1");
    partition(LP, LOPEN, LOBBY, 0, "sign:1", "sign:3");

    /* ── the lobby ── glass doors behind you, an olive tree either side of them, the light */
    b.zone = LOBBY;
    for (const s of [-1, 1]) {
      const x0 = s < 0 ? -1.22 : 0.02, x1 = s < 0 ? -0.02 : 1.22;
      b.box("glass", x0, 0.03, -0.03, x1, 2.57, -0.012);
      b.box("brass", x0, 0, -0.05, x1, 0.03, -0.01); b.box("brass", x0, 2.57, -0.05, x1, 2.6, -0.01);
      b.box("brass", x0, 0.03, -0.05, x0 + 0.03, 2.57, -0.01); b.box("brass", x1 - 0.03, 0.03, -0.05, x1, 2.57, -0.01);
      b.box("brass", s < 0 ? -0.13 : 0.11, 0.95, -0.09, s < 0 ? -0.11 : 0.13, 1.55, -0.06);
    }
    const ctx = { solid, spot, point, can, shade, decals, glows, washes, downlight };
    plant(b, ctx, -6.25, -0.62, "tree", { seed: 11, pot: "basalt", h: 2.1 });
    plant(b, ctx, 6.25, -0.4, "tree", { seed: 23, pot: "basalt", h: 1.95 });
    downlight([-2.2, H, -2.0], [-2.2, 0, -2.1], 6, 48, 20, 6);
    downlight([2.2, H, -2.0], [2.2, 0, -2.1], 6, 48, 20, 6);
    point([0, 2.9, -2.2], WARM, 0.8, 7);

    /* ── the Granite Kitchen Sink room: its island, and the kitchen round it ──
       The island is the room's installation: a 900 mm sink base under a thick slab of stone that falls to the floor
       at both ends, the sink chosen fitted to it (or, shown on its own, on a plinth). The kitchen round it — its
       joinery, its stone, its light — takes the preset that suits that sink; its own lights are set in it.    */
    const KI = buildIsland(b, ctx, { cx: 0, cz: IZ, turn: false, style: "granite", sink: o.sink || null, display: o.display, zone: ISLAND, gzone: 0, frontPower: o.frontPower, theme: T, color: T.key });
    furnishGranite(b, ctx, T);

    /* ── Sanitary Gallery: a floating vanity under a dark mirror ── */
    b.zone = 1;
    const VZ0 = -18.6, VZ1 = -16.2, VX = -W + 0.55, VM = (VZ0 + VZ1) / 2;
    b.box("walnut", -W, 0.42, VZ0, VX, 0.84, VZ1, { off: [0.4, 0.2], skip: "-x" });
    b.box("brass", -W, 0.84, VZ0, VX, 0.846, VZ1, { skip: "-x+y-y" });
    b.box("marble", -W, 0.846, VZ0 - 0.02, VX + 0.04, 0.886, VZ1 + 0.02, { off: [0.7, 0.3], skip: "-x" });
    b.box("dark", VX - 0.0015, 0.43, VM - 0.003, VX + 0.0015, 0.83, VM + 0.003);
    b.box("glow", -W + 0.05, 0.416, VZ0 + 0.05, VX - 0.04, 0.42, VZ1 - 0.05, { skip: "+y" });
    b.box("mirror", -W, 1.05, VZ0 + 0.35, -W + 0.02, 2.25, VZ1 - 0.35, { skip: "-x" });
    b.box("brass", -W, 1.04, VZ0 + 0.34, -W + 0.025, 1.05, VZ1 - 0.34, { skip: "-x" }); b.box("brass", -W, 2.25, VZ0 + 0.34, -W + 0.025, 2.26, VZ1 - 0.34, { skip: "-x" });
    b.box("brass", -W, 1.04, VZ0 + 0.34, -W + 0.025, 2.26, VZ0 + 0.35, { skip: "-x" }); b.box("brass", -W, 1.04, VZ1 - 0.35, -W + 0.025, 2.26, VZ1 - 0.34, { skip: "-x" });
    downlight([-W + 0.75, H, VM], [-W + 0.25, 0.9, VM], 7, 42, 22, 5);
    solid(-W, VZ0 - 0.02, VX + 0.04, VZ1 + 0.02, 0.886, 0.42);
    shade(-W, VZ0 - 0.15, VX + 0.3, VZ1 + 0.15, 0.3);

    /* a shower enclosure in charcoal tile, half screened in glass */
    const SX = 5.5, SZ0 = -19.7, SZ1 = -16.7;
    b.box("tile", SX, 0, SZ1 - 0.1, W, 2.4, SZ1, { k: 1 / 1.2, skip: "+x" });
    b.box("tile", SX, 0, SZ0, W, 2.4, SZ0 + 0.1, { k: 1 / 1.2, skip: "+x" });
    b.box("tile", SX + 0.05, 0, SZ0 + 0.1, W, 0.025, SZ1 - 0.1, { k: 1 / 1.2, skip: "+x-y" });
    b.box("tile", W - 0.03, 0.025, SZ0 + 0.1, W, 2.4, SZ1 - 0.1, { k: 1 / 1.2, skip: "+x-y" });
    b.box("dark", SX, 2.4, SZ0, W, 2.46, SZ1, { skip: "+x" });
    b.box("glass", SX - 0.006, 0.025, SZ1 - 1.5, SX + 0.006, 2.2, SZ1 - 0.1);
    b.box("brass", SX - 0.01, 2.2, SZ1 - 1.52, SX + 0.01, 2.22, SZ1 - 0.1);
    b.box("brass", SX - 0.01, 0.025, SZ1 - 1.52, SX + 0.01, 2.22, SZ1 - 1.5);
    b.box("emit", 6.2, 2.396, -18.3, 6.3, 2.4, -18.0, { skip: "+y" });
    glows.push({ pos: [6.25, 2.38, -18.15], size: 0.22, color: WARM2, k: 0.5 });
    spot([6.05, 2.38, -18.15], [W, 1.45, -18.15], WARM2, 2.3, 50, 28, 4);
    solid(SX - 0.02, SZ1 - 0.1, W, SZ1, 2.46); solid(SX - 0.02, SZ0, W, SZ0 + 0.1, 2.46);
    solid(SX - 0.02, SZ1 - 1.52, SX + 0.02, SZ1 - 0.1, 2.22, 0, true);
    shade(SX - 0.12, SZ0 - 0.12, W, SZ1 + 0.12, 0.35);

    /* a marble bench, so the room is a room to stand in */
    b.box("marble", -0.9, 0, -19.75, 0.9, 0.45, -19.3, { off: [0.5, 0.9], skip: "-y" });
    solid(-0.9, -19.75, 0.9, -19.3, 0.45);
    shade(-1.08, -19.95, 1.08, -19.1, 0.7);

    /* the far wall: fluted walnut, washed from above, with the house's name on a black stone plaque */
    for (let x = -3; x < 3 - 0.01; x += 0.047) b.box("walnut", x, 0, -D, x + 0.035, 3.3, -D + 0.028, { skip: "-z-y", off: [x * 1.7, 0] });
    b.box("dark", -3, 0, -D, 3, 3.3, -D + 0.006, { skip: "-z-y" });
    b.box("emit", -3, 3.296, -D, 3, 3.3, -D + 0.03, { skip: "+y" });
    downlight([-1.6, H, -D + 0.5], [-1.6, 0.6, -D + 0.02], 9, 40, 18, 6);
    downlight([1.6, H, -D + 0.5], [1.6, 0.6, -D + 0.02], 9, 40, 18, 6);
    b.box("marble", -0.8, 1.38, -D + 0.028, 0.8, 1.98, -D + 0.05, { off: [0.3, 0.3] });
    b.panel("logo", [0, 1.68, -D + 0.0505], [1, 0, 0], [0, 1, 0], 1.2, 0.3);
    point([0, 2.9, -17.0], WARM, 0.9, 7);
    /* light for the vanity front, the shower screen and the bench */
    downlight([-4.9, H, -17.4], [-6.3, 0.7, -17.4], 7, 44, 22, 6);
    downlight([4.2, H, -18.2], [5.6, 0.9, -18.2], 6, 44, 22, 6);
    downlight([0, H, -19.2], [0, 0.2, -19.5], 6, 42, 18, 6);
    /* the Stainless Steel Kitchen Sink room, through the lobby's right-hand wall */
    const wing = o.wing ? buildWing(b, ctx, o.wing) : null;
    if (wing) Object.assign(envs, wing.envs);
    /* the Wellup Door Hall, through the lobby's left-hand wall */
    const hall = o.hall ? buildHall(b, ctx, o.hall) : null;
    if (hall) Object.assign(envs, hall.envs);
    return { colliders, lights, washes, decals, glows, envs, spot, can, shade, solid, wing, hall, islands: [KI, wing ? wing.island : null] };
  };

  /* where a print hangs, how it is framed, the light aimed at it, and where to stand to see it */
  const placeOf = (pl) => {
    if (pl.kind === "wall") {
      const x = pl.side * W, n = [-pl.side, 0, 0], r = pl.side < 0 ? [0, 0, -1] : [0, 0, 1];
      return { c: [x, pl.y, pl.z], r, u: [0, 1, 0], n, w: pl.w, h: pl.h, wall: true,
        light: { pos: [pl.side * (W - 1.3), H - 0.02, pl.z], at: [pl.side * W, pl.y - 0.06, pl.z], power: 9, outer: 24, inner: 13 },
        view: { pos: [pl.side * (W - 1.85), EYE, pl.z], at: [x, pl.y - 0.04, pl.z] } };
    }
    if (pl.kind === "front") {
      /* on a partition, facing the way you came in */
      return { c: [pl.x, pl.y, pl.z], r: [1, 0, 0], u: [0, 1, 0], n: [0, 0, 1], w: pl.w, h: pl.h, wall: true,
        light: { pos: [pl.x, H - 0.02, pl.z + 1.3], at: [pl.x, pl.y - 0.06, pl.z], power: 9, outer: 24, inner: 13 },
        view: { pos: [pl.x, EYE, pl.z + 1.85], at: [pl.x, pl.y - 0.04, pl.z] } };

    return { c: [W - 0.03, pl.y, pl.z], r: [0, 0, 1], u: [0, 1, 0], n: [-1, 0, 0], w: pl.w, h: pl.h, wall: true, light: null,
      view: { pos: [4.0, EYE, pl.z - 0.35], at: [W - 0.04, pl.y - 0.05, pl.z] } };
  };

  /* Build one exhibit into the room. A print: a frame, a brass fillet, the
     photograph and a nameplate, its light and a can in the ceiling for it.
     A kitchen's island: its nameplate, and its pendant's light. Returns
     what the walk needs to find it, highlight it and stand in front of it. */
  const buildExhibit = (b, room, pl, i, o = {}) => {
    if (pl.kind === "doorway") {
      /* the Door Hall's installation: the door chosen, standing in its frame in the portal. The leaf a 4 cm box with the
         door's photograph on its face, its edges in the leaf's own colour; the frame round it in the frame's; between
         them a dark 4 mm gap, the rebate behind it — all drawn as photographed (unlit, outside the filmic curve). Its
         name on the floor before it. */
      const d = room.hall && room.hall.door;
      if (!d) return null;
      b.zone = HALL;
      const xf = d.x, xb = xf - LEAF_T, y0 = LEAF_Y, y1 = LEAF_Y + LEAF_H, zl = DZC + LEAF_W / 2, zr = DZC - LEAF_W / 2;
      b.panel("doorleaf:" + i, [xf + 0.0004, (y0 + y1) / 2, DZC], [0, 0, -1], [0, 1, 0], LEAF_W, LEAF_H);
      b.box("dooredge:" + i, xb, y0, zr, xf, y1, zl, { skip: "+x-x-y", k: 2.5 });
      /* the gap and the rebate behind it: dark, a little larger than the leaf */
      b.panel("dark", [xb - 0.006, (y0 + y1 + GAP) / 2, DZC], [0, 0, -1], [0, 1, 0], LEAF_W + 2 * GAP + 0.012, LEAF_H + GAP + 0.012);
      /* the frame: two jambs to the floor and the head across them, against the portal's back */
      const kx0 = XB, kx1 = XB + KD, ky1 = y1 + GAP, kyt = ky1 + KW;
      b.box("doorframe:" + i, kx0, 0, zl + GAP, kx1, kyt, zl + GAP + KW, { skip: "-x-y", k: 2.5 });
      b.box("doorframe:" + i, kx0, 0, zr - GAP - KW, kx1, kyt, zr - GAP, { skip: "-x-y", k: 2.5 });
      b.box("doorframe:" + i, kx0, ky1, zr - GAP, kx1, kyt, zl + GAP, { skip: "-x-z+z", k: 2.5, off: [0.37, 0.11] });
      /* its name on the floor, centred before it: a dark plaque, laid in */
      b.panel("label:" + i, [DX1 + 0.3, 0.0025, DZC], [0, 0, -1], [-1, 0, 0], 0.84, 0.2);
      b.zone = 0;
      const c = [xf, y0 + LEAF_H / 2, DZC];
      return { index: i, place: pl, c, n: [1, 0, 0], w: LEAF_W, h: LEAF_H, light: d.spot, sinkLight: -1, door: true,
        pick: { c, r: [0, 0, -1], u: [0, 1, 0], n: [1, 0, 0], hw: LEAF_W / 2 + GAP + KW, up: LEAF_H / 2 + GAP + KW, down: LEAF_H / 2 },
        view: { pos: [xf + 4.0, EYE, DZC], at: [xf, 1.08, DZC] }, zone: HALL, anchor: [xf + 0.03, 2.26, DZC] };
    }
    if (pl.kind === "station") {
      /* a kitchen's installation: its nameplate on the island's cabinet, below the stone, read as you walk up; and
         the pendant's light twice over — round the island for the room, and in display white aimed into the sink,
         which only the island sees */
      const isl = room.islands[pl.isle];
      if (!isl) return null;
      const top = isl.sinkAt ? isl.sinkAt[1] : 0.92, pos = [isl.cx, 2.17, isl.cz];
      const lw = 0.44, lh = lw / 5.33;
      b.zone = isl.gzone;
      if (isl.plaque) {
        const pc = isl.plaque.c, pn = isl.plaque.n, pr = isl.plaque.r, pu = [0, 1, 0];
        b.slab("dark", add(pc, scale(pn, 0.008)), pr, pu, lw + 0.016, lh + 0.012, 0.008);
        b.panel("label:" + i, add(pc, scale(pn, 0.0092)), pr, pu, lw, lh);
      }
      const light = room.spot(pos, [isl.cx, 0.95, isl.cz], isl.color || WARM2, 5.5, 30, 16, 7, [isl.gzone]);
      const sinkLight = isl.sinkAt ? room.spot(pos, [isl.sinkAt[0], top - 0.12, isl.sinkAt[2]], DISPLAY, 5.5 * (o.pendantPower || 0.3), 30, 16, 7, [isl.zone]) : -1;
      b.zone = 0;
      const f = isl.turn ? [-1, 0, 0] : [0, 0, 1], c = [isl.cx, top - 0.08, isl.cz];
      return { index: i, place: pl, c, n: f, w: 0.66, h: 0.66, light, sinkLight, island: pl.isle, station: true,
        pick: { c, r: isl.turn ? [0, 0, 1] : [1, 0, 0], u: [0, 1, 0], n: f, hw: 0.4, up: 0.3, down: 0.3 },
        view: { pos: [isl.cx + f[0] * 1.42, EYE, isl.cz + f[2] * 1.42], at: [isl.cx, top - 0.1, isl.cz] }, zone: isl.zone };
    }
    const P = placeOf(pl), { c, r, u, n, w, h } = P;
    b.zone = zoneOf(c[2]);
    const at = (dn, du = 0) => add(add(c, scale(n, dn)), scale(u, du));
    b.slab("dark", at(0.04), r, u, w + 0.09, h + 0.09, 0.035);
    b.panel("brass", at(0.0412), r, u, w + 0.026, h + 0.026, [0, 0, 1, 0.03]);
    b.panel("print:" + i, at(0.0424), r, u, w, h);
    b.slab("dark", at(0.016, -h / 2 - 0.15), r, u, 0.5, 0.1, 0.012);
    b.panel("label:" + i, at(0.0172, -h / 2 - 0.15), r, u, 0.48, 0.09);
    /* the frame's own shadow on the wall, a little below it, as the light comes from above */
    room.decals.push({ kind: "quad", c: at(0.0015, -0.06), r, u, w: (w + 0.09) * 1.3, h: (h + 0.09) * 1.3, k: 0.55 },
      { kind: "quad", c: at(0.0012, -h / 2 - 0.17), r, u, w: 0.64, h: 0.16, k: 0.35 });
    let light = -1;
    if (P.light) {
      const L = P.light;
      room.can(L.pos[0], L.pos[2]);
      light = room.spot(L.pos, L.at, WARM2, L.power, L.outer, L.inner, 7, null);
    }
    /* the face a look can land on: the print and its nameplate; the point its marker is drawn at */
    const pick = { c, r, u, n, hw: w / 2 + 0.05, up: h / 2 + 0.05, down: h / 2 + 0.24 };
    return { index: i, place: pl, c, n, w, h, light, sinkLight: -1, pick, view: P.view, zone: zoneOf(c[2]), anchor: at(0.06, h / 2 - 0.1) };
  };

  /* ── the Stainless Steel Kitchen Sink room ────────────────────────────────
     A room of its own, through an opening in the lobby's right-hand wall.
     Plan, in metres (the lobby's right wall is x = 7):
       x 7.25 → 17.65   the room, 10.4 m long, looking in from the opening
       z −6.1 → 2.3     8.4 m across; the opening at z −3.1 → −0.7
       in the middle, the island — the room's installation, the stainless
       sink chosen fitted to it — turned to face you as you come in; along
       the far wall tall units and a run under thin honed stone; on the left
       tall cabinets with bays of smoked glass; on the right a reeded wall
       with the house's name, and a bench in front of it. Troweled
       microcement, a lighter ceiling with two lines of light let into it,
       neutral light — about 4000 K — so brushed steel reads as steel.     */
  const GX0 = W + 0.25, GX1 = GX0 + 10.4, GZ0 = -6.1, GZ1 = 2.3, GZC = (GZ0 + GZ1) / 2, GOP0 = -3.1, GOP1 = -0.7;
  const GXC = (GX0 + GX1) / 2;
  /* its light sets: the room itself, and the island */
  const WING = 5, WISL = 6, NEAR_WISL = [WING, WISL];
  const inWing = (x) => x > W + 0.12;

  /* ── the Wellup Door Hall ─────────────────────────────────────────────────
     A room of its own, through an opening in the lobby's left-hand wall — as the stainless room is through its right —
     given to the Wellup bathroom doors: a stage for one door at a time.
     Plan, in metres (the lobby's left wall is x = −7):
       x −7.25 → −13.65   the hall, 6.4 m long, looking in from the opening
       z −5.6 → −0.4      5.2 m across; the opening at z −4.0 → −2.0, straight across from the door
     At its end, in a wall of warm greige limewash, a portal 120 cm wide, 240 high and 15 deep, its inside edges lit by
     hidden strips of warm light (about 3000 K) along the top and both sides; in it the door chosen, at its listed size
     of 70 x 200 cm, in a frame (kusen) of its own colour with a 4 mm shadow gap round the leaf. The leaf is a 4 cm box
     with the door's own photograph on its face — cut to the leaf and straightened (img/doors/leaf) — drawn as it was
     photographed: unlit and outside the filmic curve, so no light in the room tints it and a white door stays white;
     its edges and its frame in the colours sampled from the same photograph. One warm spotlight in the ceiling right
     above the door washes the portal wall and leaves a pool on the floor before it; away from the door the room falls
     into the dark (HALL_FOCUS). A dark terrazzo floor that softly mirrors the door, a ceiling near black. A niche of
     rolled towels far left, a small plant on the right, a round WC plaque by the portal: all in the dim, none of them
     brighter than the door. Nothing stands between the door and you.                                          */
  const DX0 = -W - 0.25, DX1 = DX0 - 6.4, DZ0 = -5.6, DZ1 = -0.4, DOP0 = -4.0, DOP1 = -2.0, DZC = (DOP0 + DOP1) / 2;
  /* its light set */
  const HALL = 7;
  const inHall = (x) => x < -W - 0.12;

  /* ── an island: a 900 mm sink base under a slab of stone, in its room's preset `I.theme`, drawn in its room's

                   the preset's cabinetry with a channel under the stone to take hold of, a fine line of the
                   preset's metal in it; three bronze rings of light over it, sculpture in the cove;

                   channel and a steel kick set back under them, the stools' side lined in the preset's wood; a
                   single slim line of light over it.
     It is a kitchen's installation, laid out round the sink on it: either the sink stands on a charcoal plinth on the

     stone, which is cut for its bowls; a top-mount sink resting on the stone by its rim, over a cut-out the rim hides.

    const mapSkip = (s) => (turn && s ? s.replace(/[+-][xz]/g, (m) => SK[m]) : s || "");

        e([-hw, -hd], [hw, -hd], o(0, -1)); e([-hw, hd], [hw, hd], o(0, 1)); e([hw, -hd], [hw, hd], o(1, 0)); e([-hw, -hd], [-hw, hd], o(-1, 0));

      const [sw, sd] = S3.size, m = 0.06, px = sw / 2 + m, pz = sd / 2 + m, y0 = isl.y1;

      box("dark", -bx, y0 + 0.006, -bz, bx, ys, bz, { skip: "-y+y" });

      b.slabWithHole("charcoal", { ...rect(-px, -pz, px, pz), y0: ys, y1 }, { ...rect(-sw / 2 + lip, -sd / 2 + lip, sw / 2 - lip, sd / 2 - lip), r: 0.004 });

  /* ── the room's shell, its light, its kitchen and its island ── */

    washes.push({ a: [GX1 - 0.04, H - 0.01, GZ0], b: [GX1 - 0.04, H - 0.01, GZ1], color: T.light, power: 1 * T.power, zone: WING, zones: NEAR_WISL });
    decals.push({ kind: "foot", axis: "x", at: GX1, a: GZ0, b: GZ1, dir: -1 });

    b.box("microcement", W, 0, GOP1 + 0.012, GX0, H, GZ1, { skip: "-x+y-y+z-z" });

    b.box("brass", DX0, 0, DOP1, -W, LINTEL, DOP1 + 0.012, { skip: "+z-y" });
    b.box("brass", DX0, LINTEL - 0.012, DOP0 - 0.012, -W, LINTEL, DOP1 + 0.012, { skip: "+y" });
    /* the end wall: limewash, with the portal cut in it, and the towel niche far left (z towards DZ1, as you face it) */
    const NZ0 = DZ1 - 1.15, NZ1 = DZ1 - 0.65, NY0 = 0.98, NY1 = 1.56, ND = 0.2;
    const holes = [[DZC - PW / 2, DZC + PW / 2, 0, PH], [NZ0, NZ1, NY0, NY1]];
    const zs = [...new Set([DZ0, DZ1, ...holes.flatMap((h) => [h[0], h[1]])])].sort((p, q) => p - q);
    const ys = [...new Set([0, H, ...holes.flatMap((h) => [h[2], h[3]])])].sort((p, q) => p - q);
    for (let i = 0; i < zs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
      const za = zs[i], zb = zs[i + 1], ya = ys[j], yb = ys[j + 1], zm = (za + zb) / 2, ym = (ya + yb) / 2;
      if (holes.some((h) => zm > h[0] && zm < h[1] && ym > h[2] && ym < h[3])) continue;
      b.face("limewash", [DX1, ya, zb], [DX1, ya, za], [DX1, yb, za], [DX1, yb, zb], [1, 0, 0], uvw);
    }
    decals.push({ kind: "foot", axis: "x", at: DX1, a: DZ0, b: DZC - PW / 2, dir: 1 }, { kind: "foot", axis: "x", at: DX1, a: DZC + PW / 2, b: DZ1, dir: 1 });
    /* a recess cut into the end wall: its back, its sides, its top (and, for the niche, its sill) */
    const recess = (z0, z1, y0, y1, d, sill) => {
      const x0 = DX1 - d, x1 = DX1;
      b.face("limewash", [x0, y0, z1], [x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [1, 0, 0], uvw);
      b.face("limewash", [x1, y0, z1], [x0, y0, z1], [x0, y1, z1], [x1, y1, z1], [0, 0, -1], uvd);
      b.face("limewash", [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [0, 0, 1], uvd);
      b.face("limewash", [x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1], [0, -1, 0], uvc);
      if (sill) b.face("limewash", [x0, y0, z1], [x1, y0, z1], [x1, y0, z0], [x0, y0, z0], [0, 1, 0], uvc);
    };
    recess(NZ0, NZ1, NY0, NY1, ND, true);
    /* the portal: its back and its reveals in plaster of their own (portalBack, portalReveal), which carries the glow of
       the hidden strips — warm and bright along its top and both sides, falling away towards the door: the outline of
       light round it. The strips themselves are a fine line in the portal's back corners, half hidden by the reveals. */
    const zl = DZC + PW / 2, zr = DZC - PW / 2;
    b.face("portalBack", [XB, 0, zr], [XB, 0, zl], [XB, PH, zl], [XB, PH, zr], [1, 0, 0], (p) => [(zl - p[2]) / PW, 1 - p[1] / PH]);
    const rv = (p) => [(p[0] - XB) / PD, 0.5];
    b.face("portalReveal", [DX1, 0, zl], [XB, 0, zl], [XB, PH, zl], [DX1, PH, zl], [0, 0, -1], rv);
    b.face("portalReveal", [XB, 0, zr], [DX1, 0, zr], [DX1, PH, zr], [XB, PH, zr], [0, 0, 1], rv);
    b.face("portalReveal", [XB, PH, zr], [DX1, PH, zr], [DX1, PH, zl], [XB, PH, zl], [0, -1, 0], rv);
    const e = 0.008;
    b.box("ledStrip", XB, 0.025, zl - e, XB + e, PH - e, zl, { skip: "-x+z" });
    b.box("ledStrip", XB, 0.025, zr, XB + e, PH - e, zr + e, { skip: "-x-z" });
    b.box("ledStrip", XB, PH - e, zr, XB + e, PH, zl, { skip: "-x+y+z-z" });
    /* the one spotlight, in the ceiling right above the door: it washes the portal wall and pools on the floor before it
       (the door itself is lit only by its photograph) */
    const spotI = downlight([DX1 + 0.8, H, DZC], [DX1 + 0.05, 0.75, DZC], 5 + 3.5 * F, 34, 11, 7, [HALL], W3K, "emit");
    /* the room's own light, little of it: a soft fill, and a faint wash down the wall you came in by */
    point([DX0 - 2.6, 2.9, DZC], WARM, 0.55 * (1 - 0.75 * F), 7, [HALL]);
    washes.push({ a: [DX0 - 0.04, H - 0.01, DZ0], b: [DX0 - 0.04, H - 0.01, DZ1], color: WARM, power: 0.28 * (1 - 0.6 * F), zone: HALL, zones: [HALL] });
    /* in the niche, far left: white towels, rolled — three below, two on them */
    const roll = (cy, cz, r) => {
      const seg = 14, xa = DX1 - ND + 0.015, xb = DX1 - 0.025;
      const at = (k) => { const a = (k / seg) * Math.PI * 2; return [Math.cos(a), Math.sin(a)]; };
      for (let k = 0; k < seg; k++) {
        const [c0, s0] = at(k), [c1, s1] = at(k + 1), [cm, sm] = at(k + 0.5);
        b.face("towel", [xa, cy + r * s0, cz + r * c0], [xb, cy + r * s0, cz + r * c0], [xb, cy + r * s1, cz + r * c1], [xa, cy + r * s1, cz + r * c1], [0, sm, cm],
          (p) => [p[0] * 3, (k / seg) * 2]);
        b.face("towelEnd", [xb, cy, cz], [xb, cy + r * s0, cz + r * c0], [xb, cy + r * s1, cz + r * c1], [xb, cy, cz], [1, 0, 0], (p) => [p[1] * 9, p[2] * 9]);
      }
    };
    const tr = 0.052, tz = (NZ0 + NZ1) / 2;
    point([DX1 + 0.12, NY1 - 0.02, tz], W3K, 0.1, 0.6, [HALL]);
    for (const dz of [-0.108, 0, 0.108]) roll(NY0 + tr, tz + dz, tr);
    for (const dz of [-0.054, 0.054]) roll(NY0 + tr * 2.7, tz + dz, tr);
    shade(DX1 - ND, NZ0, DX1, NZ1, 0.0);
    /* on the right, well away from the door: a small plant in a dark pot */
    const PX = DX1 + 0.62, PZ = DZ0 + 0.62;
    plant(b, ctx, PX, PZ, "pot", { seed: 41, pot: "basalt", potR: 0.13, potH: 0.3, leaves: 15, size: 1.15 });
    solid(PX - 0.17, PZ - 0.17, PX + 0.17, PZ + 0.17, 0.62);
    shade(PX - 0.3, PZ - 0.3, PX + 0.3, PZ + 0.3, 0.45);
    /* the door's own shade where it stands: on the portal's back round the frame, on the floor round its foot, a line
       of contact before it */
    const fw = LEAF_W + 2 * (GAP + KW), fh = LEAF_Y + LEAF_H + GAP + KW;
    decals.push({ kind: "quad", c: [XB + 0.0015, fh / 2 - 0.03, DZC], r: [0, 0, -1], u: [0, 1, 0], w: fw + 0.22, h: fh + 0.18, k: 0.5 });
    shade(XB, DZC - fw / 2 - 0.06, DX1 - 0.005, DZC + fw / 2 + 0.06, 0.55);
    decals.push({ kind: "edge", a: [XB + KD, 0.0012, DZC - fw / 2], b: [XB + KD, 0.0012, DZC + fw / 2], out: [1, 0, 0], w: 0.09, k: 0.55 });
    /* the room's name over the opening on the lobby's side; the way back over it on this side */
    b.zone = LOBBY;
    b.panel("sign:4", [-W + 0.003, 3.08, DZC], [0, 0, -1], [0, 1, 0], 2.4, 0.3);
    b.zone = HALL;
    b.panel("sign:3", [DX0 - 0.003, 3.08, DZC], [0, 0, 1], [0, 1, 0], 2.4, 0.3);
    /* the round WC plaque, on the wall by the portal, to its right as you face it */
    b.panel("sign:5", [DX1 + 0.004, 1.5, DZC - PW / 2 - 0.27], [0, 0, -1], [0, 1, 0], 0.15, 0.15);
    solid(DX1 - 1, DZ0 - 1, DX0, DZ0); solid(DX1 - 1, DZ1, DX0, DZ1 + 1);
    /* the end wall either side of the portal and above it, and the portal's back — not the portal itself, so that a look
       reaches the door standing in it */
    solid(DX1 - 1, DZ0, DX1, DZC - PW / 2); solid(DX1 - 1, DZC + PW / 2, DX1, DZ1);
    solid(DX1 - 1, DZC - PW / 2, DX1, DZC + PW / 2, H, PH); solid(DX1 - 1, DZC - PW / 2, XB, DZC + PW / 2);
    return { door: { x: XF, spot: spotI }, focus: [XF, 1.0, DZC, F], envs: { [HALL]: { warm: [0.05, 0.044, 0.036] } } };
  };

  /* ── furnishing ──────────────────────────────────────────────────────────
     What makes the two kitchens kitchens, and each its own kind of kitchen.

     The Granite Kitchen Sink room — Exclusive Dark Luxury: a bespoke kitchen
     in a private house. Substantial joinery to the ceiling's shadow line,
     large-format stone that runs up the walls behind the worktops and along
     the left wall, a wall of wooden slats behind the table, bronze, warm
     layered light — coves, lit niches, light under the shelves, sculptural
     rings over the island.

     The Stainless Steel Kitchen Sink room — Contemporary Precision Luxury:
     a kitchen drawn with a ruler. Handle-less graphite slabs with a steel
     line under every worktop, thin honed grey stone, troweled microcement,
     smoked glass in steel frames, a reeded wall, linear light let into the
     ceiling, neutral light, restrained oak.

     Everything here is the setting, not a product of the house. Some of it
     takes the palette that suits the sink on the island (`T`: cab — the
     cabinet fronts; stone — worktops, splashbacks, the stone on the walls;
     wood — tall joinery, shelves, slats; metal — trims and pulls; and the
     light's colour). The rest — the stools, the table and chairs, the
     pendants, the things that stand about, the plants — never changes.

     A turned shape — a vase, a bowl, a stool's seat, a ring of light — is
     spun from its profile. Furniture is built about its own middle and
     turned a quarter at a time, as the island is.                       */

  /* a solid turned about a vertical axis through (cx, cz): `prof` is [[r, y], …] from the bottom up. Where the
     profile bends gently its normals are shared, so a curve is drawn smooth; at a sharp turn (a rim) they are not. */
  const lathe = (b, mat, cx, cz, prof, o = {}) => {
    const seg = o.seg || 20, k = o.k || 1, n = prof.length;
    if (n < 2) return;
    const sn = [];
    for (let i = 0; i < n - 1; i++) {
      const dr = prof[i + 1][0] - prof[i][0], dy = prof[i + 1][1] - prof[i][1], l = Math.hypot(dr, dy) || 1;
      sn.push([dy / l, -dr / l]);
    }
    const smoothAt = (i) => i > 0 && i < n - 1 && sn[i - 1][0] * sn[i][0] + sn[i - 1][1] * sn[i][1] > 0.76;
    const avg = (a, c) => { const x = a[0] + c[0], y = a[1] + c[1], l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
    const ring = (r, y, j) => { const a = (j / seg) * Math.PI * 2; return [cx + Math.cos(a) * r, y, cz + Math.sin(a) * r]; };
    const nrm = (nv, j) => { const a = (j / seg) * Math.PI * 2; return [Math.cos(a) * nv[0], nv[1], Math.sin(a) * nv[0]]; };
    for (let i = 0; i < n - 1; i++) {
      const [r0, y0] = prof[i], [r1, y1] = prof[i + 1];
      if (r0 <= 0 && r1 <= 0) continue;
      const n0 = smoothAt(i) ? avg(sn[i - 1], sn[i]) : sn[i], n1 = smoothAt(i + 1) ? avg(sn[i], sn[i + 1]) : sn[i];
      const rm = (r0 + r1) / 2 || 0.01, flat = Math.abs(y1 - y0) < Math.abs(r1 - r0);
      /* (a surface that lies flatter than it stands takes its texture from above, so a seat or a dish shows no swirl) */
      const uv = flat ? (p) => [p[0] * k, p[2] * k] : (p) => { const a = Math.atan2(p[2] - cz, p[0] - cx); return [a * rm * k, p[1] * k]; };
      for (let j = 0; j < seg; j++) {
        b.faceN(mat, ring(r0, y0, j), ring(r0, y0, j + 1), ring(r1, y1, j + 1), ring(r1, y1, j), nrm(n0, j), nrm(n0, j + 1), nrm(n1, j + 1), nrm(n1, j), uv);
      }
    }
    /* a flat top, when it is closed */
    if (o.top) {
      const [r, y] = prof[n - 1], c = [cx, y, cz];
      for (let j = 0; j < seg; j++) b.face(mat, c, ring(r, y, j), ring(r, y, j + 1), c, [0, 1, 0], (p) => [p[0] * k, p[2] * k]);
    }
    if (o.bottom) {
      const [r, y] = prof[0], c = [cx, y, cz];
      for (let j = 0; j < seg; j++) b.face(mat, c, ring(r, y, j + 1), ring(r, y, j), c, [0, -1, 0], (p) => [p[0] * k, p[2] * k]);
    }
  };

  /* a frame for furniture: (lx, lz) about its own middle at (cx, cz), turned `q` quarter turns
     (q = 1: its front, +z, faces −x) — boxes in it, and the faces each leaves out, turned with it */
  const SKIPQ = [null, { "+x": "+z", "-x": "-z", "+z": "-x", "-z": "+x" }, { "+x": "-x", "-x": "+x", "+z": "-z", "-z": "+z" }, { "+x": "-z", "-x": "+z", "+z": "+x", "-z": "-x" }];
  const placer = (b, cx, cz, q = 0) => {
    q &= 3;
    const c = [1, 0, -1, 0][q], s = [0, 1, 0, -1][q];
    const T = (lx, lz) => [cx + lx * c - lz * s, cz + lx * s + lz * c];
    const sk = (str) => (q && str ? str.replace(/[+-][xz]/g, (m) => SKIPQ[q][m]) : str || "");
    const rect = (x0, z0, x1, z1) => { const a = T(x0, z0), d = T(x1, z1); return { x0: Math.min(a[0], d[0]), x1: Math.max(a[0], d[0]), z0: Math.min(a[1], d[1]), z1: Math.max(a[1], d[1]) }; };
    const box = (mat, x0, y0, z0, x1, y1, z1, o = {}) => { const r = rect(x0, z0, x1, z1); b.box(mat, r.x0, y0, r.z0, r.x1, y1, r.z1, { ...o, skip: sk(o.skip) }); };
    const P = (lx, y, lz) => { const p = T(lx, lz); return [p[0], y, p[1]]; };
    const dirOf = (lx, lz) => [lx * c - lz * s, 0, lx * s + lz * c];
    return { T, box, rect, P, dirOf, q };
  };

  /* ── joinery ── */
  /* A run of base cabinets against a wall, in local terms: `len` along the wall (lx from −len/2 to len/2), the wall
     at lz = 0 and the room towards +lz; placed by `F` (a placer). Handle-less: a recessed plinth; the fronts, their
     joints every `door` metres; under the worktop a channel to take hold of, set back, a line of the room's metal at
     its top; the worktop of the room's stone, `slab` thick, a little proud of the fronts; and, if asked, the stone up
     the wall behind it. Returns where its top is. */
  const baseRun = (b, ctx, F, len, T, o = {}) => {
    const d = o.depth || 0.6, top = o.top || 0.92, slab = o.slab || 0.04, over = o.over == null ? 0.02 : o.over, hl = len / 2;
    const under = top - slab, gy = under - (o.channel || 0.036);
    F.box("dark", -hl + (o.endL ? 0.03 : 0), 0, 0.03, hl - (o.endR ? 0.03 : 0), 0.1, d - 0.07, { skip: "-z" });
    if (o.kick) F.box(o.kick, -hl + (o.endL ? 0.03 : 0), 0.008, d - 0.07, hl - (o.endR ? 0.03 : 0), 0.1, d - 0.066, { skip: "-z-y+y" });
    F.box(T.cab, -hl, 0.1, 0, hl, gy, d, { skip: "-z+y", off: o.off || [0.3, 0.1] });
    F.box("dark", -hl, gy, 0, hl, under, d - 0.032, { skip: "-z+y-y" });
    F.box(T.metal, -hl, under - 0.006, d - 0.032, hl, under, d - 0.029, { skip: "-z+y" });
    const n = Math.max(1, Math.round(len / (o.door || 0.6)));
    for (let k = 1; k < n; k++) { const x = -hl + (len * k) / n; F.box("dark", x - 0.0025, 0.11, d - 0.0015, x + 0.0025, gy - 0.004, d + 0.0015); }
    if (o.drawers) for (const y of o.drawers) F.box("dark", -hl + 0.004, y - 0.0025, d - 0.0015, hl - 0.004, y + 0.0025, d + 0.0015);
    F.box(T.stone, -hl - (o.overL || 0), under, 0, hl + (o.overR || 0), top, d + over, { off: o.topOff || [0.37, 0.12], skip: "-z" });
    if (o.splash) F.box(T.stone, -hl - (o.overL || 0), top, 0, hl + (o.overR || 0), o.splash, 0.02, { off: o.splashOff || [0.2, 0.7], skip: "-z-y" });
    const r = F.rect(-hl - (o.overL || 0), 0, hl + (o.overR || 0), d + over);
    ctx.solid(r.x0, r.z0, r.x1, r.z1, top);
    const s = F.rect(-hl - 0.1, 0, hl + 0.1, d + over + 0.22);
    ctx.shade(s.x0, s.z0, s.x1, s.z1, 0.62);
    return { top, d: d + over };
  };

  /* Tall joinery against a wall, floor to `h`, in `mat` (the preset's wood unless named): doors every `door`
     metres, and on them `pull` — "edge": handle-less, the block framed in the preset's metal; "line": an upright
     channel of metal at every other joint — or none. A row of top doors over the tall ones (`split`, a height). An
     open niche, lined and lit (`niche` {x0, x1, y0, y1, back, side, strip, shelf}); a column of ovens (`ovens`
     [{x0, x1, y0, y1}]); light under its plinth, so it floats (`floatLight`); above it, the wall carried down flush
     to it (`bulk`: the wall's material) or a shadow line. Returns the niche's light's place, if it has one. */
  const tallRun = (b, ctx, F, len, T, o = {}) => {
    const d = o.depth || 0.62, h = o.h || 2.4, hl = len / 2, mat = o.mat || T.wood;
    F.box("dark", -hl, 0, 0.03, hl, 0.1, d - 0.07, { skip: "-z" });
    if (o.floatLight) {
      F.box(o.floatLight, -hl + 0.02, 0.096, d - 0.09, hl - 0.02, 0.1, d - 0.075, { skip: "+y" });
      for (let x = -hl + 0.3; x < hl - 0.2; x += 0.6) ctx.glows.push({ pos: F.P(x, 0.03, d - 0.04), size: 0.42, color: o.floatColor || [1, 0.8, 0.6], k: 0.16 });
    }
    /* the carcass, round the niche when there is one */
    const N = o.niche;
    if (!N) F.box(mat, -hl, 0.1, 0, hl, h, d, { skip: "-z", off: o.off || [0.2, 0.0] });
    else {
      F.box(mat, -hl, 0.1, 0, N.x0, h, d, { skip: "-z+x", off: o.off || [0.2, 0.0] });
      F.box(mat, N.x1, 0.1, 0, hl, h, d, { skip: "-z-x", off: [0.6, 0.0] });
      F.box(mat, N.x0, 0.1, 0, N.x1, N.y0, d, { skip: "-z-x+x", off: [0.4, 0.0] });
      F.box(mat, N.x0, N.y1, 0, N.x1, h, d, { skip: "-z-x+x", off: [0.4, 0.3] });
      /* lined: its back in the room's stone, its sides, floor and top in `side`, and a strip of light along the top */
      const nb = N.back || T.stone, ns = N.side || mat, t = 0.018;
      F.box(nb, N.x0, N.y0, 0, N.x1, N.y1, 0.02, { skip: "-z-x+x", off: [0.3, 0.5] });
      F.box(ns, N.x0, N.y0, 0.02, N.x0 + t, N.y1, d, { skip: "-z-x" });
      F.box(ns, N.x1 - t, N.y0, 0.02, N.x1, N.y1, d, { skip: "-z+x" });
      F.box(ns, N.x0 + t, N.y0, 0.02, N.x1 - t, N.y0 + t, d, { skip: "-z-y" });
      F.box(ns, N.x0 + t, N.y1 - t, 0.02, N.x1 - t, N.y1, d, { skip: "-z+y" });
      if (N.strip) F.box(N.strip, N.x0 + 0.05, N.y1 - t - 0.004, d - 0.07, N.x1 - 0.05, N.y1 - t, d - 0.05, { skip: "+y" });
      if (N.shelf) F.box(ns, N.x0 + t, N.shelf - 0.012, 0.02, N.x1 - t, N.shelf, d - 0.03);
    }
    F.box("dark", -hl, h, 0, hl, h + 0.02, d - 0.02, { skip: "-z" });
    if (o.bulk) F.box(o.bulk, -hl, h + 0.02, 0, hl, H, d, { skip: "-z+y", off: [0.1, 0.2] });
    /* doors: joints, skipping the niche and the ovens */
    const n = Math.max(1, Math.round(len / (o.door || 0.6))), xs = [];
    for (let k = 1; k < n; k++) xs.push(-hl + (len * k) / n);
    const inside = (x, y0, y1) => (N && x > N.x0 - 0.01 && x < N.x1 + 0.01 ? [[0.11, N.y0 - 0.004], [N.y1 + 0.004, h - 0.02]] : [[y0, y1]]);
    for (const x of xs) for (const [y0, y1] of inside(x, 0.11, h - 0.02)) if (y1 > y0) F.box("dark", x - 0.0025, y0, d - 0.0015, x + 0.0025, y1, d + 0.0015);
    /* across the niche, the doors above and below it meet it with a joint */
    if (N) { F.box("dark", N.x0, N.y0 - 0.006, d - 0.0015, N.x1, N.y0 - 0.002, d + 0.0015); F.box("dark", N.x0, N.y1 + 0.002, d - 0.0015, N.x1, N.y1 + 0.006, d + 0.0015); }
    /* doors to the ceiling are split, a row of top doors over the tall ones */
    if (o.split) F.box("dark", -hl, o.split - 0.0025, d - 0.0015, hl, o.split + 0.0025, d + 0.0015);
    for (const ov of o.ovens || []) {
      F.box("blackGlass", ov.x0 + 0.02, ov.y0, d, ov.x1 - 0.02, ov.y1, d + 0.004);
      F.box(T.metal, ov.x0 + 0.08, ov.y1 - 0.07, d + 0.004, ov.x1 - 0.08, ov.y1 - 0.055, d + 0.03);
      F.box("dark", ov.x0 + 0.06, ov.y0 + 0.08, d + 0.004, ov.x1 - 0.06, ov.y1 - 0.12, d + 0.0045);
    }
    const nearOven = (x) => (o.ovens || []).some((ov) => x > ov.x0 - 0.05 && x < ov.x1 + 0.05);
    if (o.pull === "edge") {
      /* handle-less, the block framed in the room's metal: a fine upright at either end, a line along the top */
      F.box(T.metal, -hl, 0.1, d, -hl + 0.012, h, d + 0.004, { skip: "-z" });
      F.box(T.metal, hl - 0.012, 0.1, d, hl, h, d + 0.004, { skip: "-z" });
      F.box(T.metal, -hl, h - 0.012, d, hl, h, d + 0.004, { skip: "-z" });
    } else if (o.pull === "line") {
      for (let k = 0; k < xs.length; k += 2) if (!nearOven(xs[k])) F.box(T.metal, xs[k] - 0.009, 0.11, d - 0.012, xs[k] + 0.009, h - 0.02, d + 0.0005, { skip: "-z" });
    }
    const r = F.rect(-hl, 0, hl, d + 0.022);
    ctx.solid(r.x0, r.z0, r.x1, r.z1, h);
    const s = F.rect(-hl - 0.1, 0, hl + 0.1, d + 0.24);
    ctx.shade(s.x0, s.z0, s.x1, s.z1, 0.55);
  };
  /* a floating shelf on the wall at height y, `deep` from it, with a strip of light under its front edge */
  const shelf = (b, F, x0, x1, y, mat, o = {}) => {
    const deep = o.deep || 0.26, t = o.t || 0.04;
    F.box(mat, x0, y - t, 0, x1, y, deep, { skip: "-z", off: o.off || [0.4, 0.2] });
    if (o.led) F.box(o.led, x0 + 0.04, y - t - 0.003, deep - 0.05, x1 - 0.04, y - t, deep - 0.03, { skip: "+y" });
  };
  /* Large-format stone on a wall, from lx x0 to x1 and y0 to y1: slabs about `w` across, each its own part of the
     block (its texture shifted), a hairline joint between them; `t` thick, standing off the wall at lz 0. */
  const slabWall = (b, F, x0, x1, y0, y1, mat, o = {}) => {
    const n = Math.max(1, Math.round((x1 - x0) / (o.w || 1.3))), w = (x1 - x0) / n, t = o.t || 0.018;
    for (let k = 0; k < n; k++) {
      const a = x0 + k * w + (k ? 0.0015 : 0), c = x0 + (k + 1) * w - (k < n - 1 ? 0.0015 : 0);
      F.box(mat, a, y0, 0, c, y1, t, { skip: "-z" + (o.skipEnds ? "-x+x" : ""), off: [0.31 * k + (o.off || 0), 0.17 * (k % 2) + 0.05] });
      if (k < n - 1) F.box("dark", c, y0, 0, c + 0.003, y1, t - 0.003, { skip: "-z" });
    }
  };
  /* Upright slats on a wall, lx x0 to x1, y0 to y1: `w` wide, `dp` deep, every `pitch`, over a dark backing */
  const slatWall = (b, F, x0, x1, y0, y1, mat, o = {}) => {
    const w = o.w || 0.045, dp = o.dp || 0.04, pitch = o.pitch || 0.08, back = 0.012;
    F.box("dark", x0, y0, 0, x1, y1, back, { skip: "-z" });
    for (let x = x0 + (pitch - w) / 2; x + w <= x1 + 1e-6; x += pitch) F.box(mat, x, y0, back, x + w, y1, back + dp, { skip: "-z", off: [x * 1.7, 0] });
  };

  /* ── light fittings ── */
  /* A ring of light: a bronze tube `R` across its middle, `r` thick, lying level at height y; a line of light round
     its underside; hung on three fine cables. Sculpture over an island. */
  const ringPendant = (b, ctx, x, y, z, R, r, metal, strip, color, top = H) => {
    const prof = [];
    for (let k = 0; k <= 16; k++) { const a = -Math.PI / 2 + (k / 16) * Math.PI * 2; prof.push([R + Math.cos(a) * r, y + Math.sin(a) * r]); }
    lathe(b, metal, x, z, prof, { seg: 48 });
    lathe(b, strip, x, z, [[R - r * 0.55, y - r * 0.86], [R + r * 0.55, y - r * 0.86]], { seg: 48 });
    for (let k = 0; k < 3; k++) {
      const a = (k / 3) * Math.PI * 2 + Math.PI / 6, px = x + Math.cos(a) * R, pz = z + Math.sin(a) * R;
      b.box("dark", px - 0.0012, y + r, pz - 0.0012, px + 0.0012, top, pz + 0.0012);
    }
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * Math.PI * 2;
      ctx.glows.push({ pos: [x + Math.cos(a) * R, y - r - 0.012, z + Math.sin(a) * R], size: 0.15, color, k: 0.3 });
    }
  };
  /* a globe of alabaster, lit from inside, on a bronze stem: over a table */
  const globePendant = (b, ctx, x, y, z, rad, color, metal = "bronze") => {
    const prof = [];
    for (let k = 0; k <= 14; k++) { const a = -Math.PI / 2 + (k / 14) * Math.PI; prof.push([Math.max(0, Math.cos(a)) * rad, y + Math.sin(a) * rad]); }
    lathe(b, "alabaster", x, z, prof, { seg: 28 });
    lathe(b, metal, x, z, [[rad * 0.32, y + rad * 0.93], [rad * 0.36, y + rad + 0.01], [0.014, y + rad + 0.03], [0, y + rad + 0.032]], { seg: 24 });
    b.box(metal, x - 0.004, y + rad + 0.03, z - 0.004, x + 0.004, H, z + 0.004);
    ctx.glows.push({ pos: [x, y, z], size: rad * 4.4, color, k: 0.42 });
  };

  /* ── furniture ── */
  /* a counter stool: four slim bronze legs, splayed a little, a ring for the feet, a deep round seat in bouclé */
  const stoolRound = (b, x, z, metal = "bronze") => {
    for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) rod(b, metal, [x + sx * 0.168, 0, z + sz * 0.168], [x + sx * 0.132, 0.61, z + sz * 0.132], 0.009);
    const rr = 0.212;
    lathe(b, metal, x, z, [[rr, 0.262], [rr + 0.008, 0.27], [rr, 0.278], [rr - 0.008, 0.27], [rr, 0.262]], { seg: 36 });
    lathe(b, metal, x, z, [[0, 0.605], [0.17, 0.605], [0.188, 0.617], [0.188, 0.624]], { seg: 36 });
    lathe(b, "boucle", x, z, [[0.188, 0.624], [0.203, 0.642], [0.208, 0.668], [0.2, 0.694], [0.172, 0.706], [0.0, 0.71]], { seg: 36 });
  };
  /* a counter stool drawn with a ruler: a sled of square steel tube, a thin leather seat; it faces +lz */
  const stoolSled = (b, F, metal = "inox") => {
    const hw = 0.19, hd = 0.18, sy = 0.65, t = 0.011;
    for (const sx of [-1, 1]) {
      const x = sx * hw;
      F.box(metal, x - t, 0, -hd, x + t, 0.022, hd);
      F.box(metal, x - t, 0, -hd, x + t, sy - 0.03, -hd + 0.022);
      F.box(metal, x - t, 0, hd - 0.022, x + t, sy - 0.03, hd);
      F.box(metal, x - t, sy - 0.052, -hd, x + t, sy - 0.03, hd);
    }
    F.box(metal, -hw, 0.24, hd - 0.02, hw, 0.262, hd);
    F.box(metal, -hw, sy - 0.052, -hd + 0.01, hw, sy - 0.034, -hd + 0.03);
    F.box("leather", -hw - 0.012, sy - 0.03, -hd - 0.012, hw + 0.012, sy + 0.022, hd + 0.012);
  };
  /* a dining chair, upholstered: a deep seat and a back in bouclé on dark walnut legs; it faces +lz */
  const chairSoft = (b, F) => {
    const w = 0.5, sd = 0.5, sy = 0.46, lg = 0.034;
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) F.box("walnut", sx * (w / 2 - 0.04) - lg / 2, 0, sz * (sd / 2 - 0.04) - lg / 2, sx * (w / 2 - 0.04) + lg / 2, sy - 0.06, sz * (sd / 2 - 0.04) + lg / 2);
    F.box("walnut", -w / 2 + 0.02, sy - 0.1, -sd / 2 + 0.02, w / 2 - 0.02, sy - 0.06, sd / 2 - 0.02);
    F.box("boucle", -w / 2, sy - 0.06, -sd / 2, w / 2, sy + 0.04, sd / 2 + 0.01);
    F.box("boucle", -w / 2 + 0.01, sy + 0.04, -sd / 2, w / 2 - 0.01, 0.88, -sd / 2 + 0.07);
    F.box("boucle", -w / 2 + 0.03, 0.88, -sd / 2 + 0.005, w / 2 - 0.03, 0.9, -sd / 2 + 0.065);
  };
  /* A dining table with rounded ends: a top of figured walnut, `w` long (lx) and `d` across, on two turned pedestals
     of dark bronze. */
  const tableRound = (b, ctx, F, w, d, o = {}) => {
    const h = 0.75, t = 0.045, r = d / 2, top = o.top || "walnut";
    const c = F.P(0, 0, 0), along = F.dirOf(1, 0), long = Math.abs(along[0]) > 0.5;
    const hx = long ? w / 2 : d / 2, hz = long ? d / 2 : w / 2;
    const ring = rrect(c[0] - hx, c[0] + hx, c[2] - hz, c[2] + hz, r, 10, 6, 6);
    const uv = (p) => [p[0] * 0.9 + 0.15, p[2] * 0.9 + 0.4];
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], e = ring[(i + 1) % ring.length], C = [c[0], h, c[2]];
      b.face(top, C, [a.x, h, a.z], [e.x, h, e.z], C, [0, 1, 0], uv);
      b.face(top, [c[0], h - t, c[2]], [e.x, h - t, e.z], [a.x, h - t, a.z], [c[0], h - t, c[2]], [0, -1, 0], uv);
      b.faceN(top, [a.x, h - t, a.z], [e.x, h - t, e.z], [e.x, h, e.z], [a.x, h, a.z], [a.hx, 0, a.hz], [e.hx, 0, e.hz], [e.hx, 0, e.hz], [a.hx, 0, a.hz], (p) => [(p[0] + p[2]) * 0.9, p[1] * 0.9]);
    }
    for (const s of [-1, 1]) {
      const p = F.P(s * (w / 2 - 0.55), 0, 0);
      lathe(b, o.base || "bronze", p[0], p[2], [[0.2, 0], [0.2, 0.012], [0.16, 0.03], [0.07, 0.09], [0.055, 0.4], [0.07, h - t - 0.05], [0.13, h - t - 0.01], [0.13, h - t]], { seg: 28 });
    }
    const R = F.rect(-w / 2, -d / 2, w / 2, d / 2);
    ctx.solid(R.x0, R.z0, R.x1, R.z1, h, 0, true);
    const S = F.rect(-w / 2 - 0.12, -d / 2 - 0.12, w / 2 + 0.12, d / 2 + 0.12);
    ctx.shade(S.x0, S.z0, S.x1, S.z1, 0.5);
  };
  /* a rug: a low woven slab on the floor, under a table */
  const rug = (b, x0, z0, x1, z1, mat = "fabric") => {
    b.box(mat, x0, 0, z0, x1, 0.007, z1, { skip: "-y", k: 1.4 });
  };
  /* A low credenza against a wall: a body of reeded walnut (`reeds`), a slab of honed charcoal stone on it, a
     bronze line at its foot; it faces +lz. */
  const credenza = (b, ctx, F, len, o = {}) => {
    const d = o.depth || 0.48, h = o.h || 0.68, hl = len / 2, top = 0.035;
    F.box("dark", -hl + 0.04, 0, 0.03, hl - 0.04, 0.07, d - 0.05, { skip: "-z" });
    F.box("bronze", -hl + 0.04, 0.066, d - 0.05, hl - 0.04, 0.072, d - 0.045, { skip: "-z" });
    F.box(o.body || "walnut", -hl, 0.07, 0, hl, h - top, d, { skip: "-z+y" });
    if (o.reeds) F.box(o.reeds, -hl + 0.01, 0.09, d, hl - 0.01, h - top - 0.02, d + 0.002, { skip: "-z" });
    F.box("charcoal", -hl - 0.01, h - top, 0, hl + 0.01, h, d + 0.012, { skip: "-z", off: [0.2, 0.4] });
    const r = F.rect(-hl - 0.01, 0, hl + 0.01, d + 0.012);
    ctx.solid(r.x0, r.z0, r.x1, r.z1, h);
    const s = F.rect(-hl - 0.1, 0, hl + 0.1, d + 0.22);
    ctx.shade(s.x0, s.z0, s.x1, s.z1, 0.55);
  };
  /* A run of tall cabinets with bays of smoked glass in brushed steel frames, lit inside, between plain doors.
     `bays` along lx: [{ w, glass }]. Inside each glass bay, three shelves of steel. Returns each glass bay's middle. */
  const vitrine = (b, ctx, F, bays, T, o = {}) => {
    const d = o.depth || 0.5, len = bays.reduce((s, q) => s + q.w, 0), fr = 0.026, glassBays = [];
    /* (to the ceiling: the glass up to `split`, a row of top doors over it) */
    const top = o.h || 2.7, h = o.split || top;
    if (o.split) {
      F.box(T.cab, -len / 2, h, 0, len / 2, top, d, { skip: "-z", off: [0.1, 0.3] });
      F.box("dark", -len / 2, h - 0.0025, d - 0.0015, len / 2, h + 0.0025, d + 0.0015);
      let xj = -len / 2; for (const q of bays.slice(0, -1)) { xj += q.w; F.box("dark", xj - 0.0025, h, d - 0.0015, xj + 0.0025, top - 0.01, d + 0.0015); }
    }
    F.box("dark", -len / 2, 0, 0.03, len / 2, 0.1, d - 0.07, { skip: "-z" });
    F.box(T.metal, -len / 2, 0.008, d - 0.07, len / 2, 0.1, d - 0.066, { skip: "-z-y+y" });
    let x = -len / 2;
    for (const q of bays) {
      const x0 = x, x1 = x + q.w;
      if (!q.glass) {
        F.box(T.cab, x0, 0.1, 0, x1, h, d, { skip: "-z", off: [x0 * 0.7, 0.1] });
        F.box("dark", x1 - 0.0025, 0.11, d - 0.0015, x1 + 0.0025, h - 0.01, d + 0.0015);
        F.box(T.metal, x1 - 0.03, 0.11, d - 0.012, x1 - 0.012, h - 0.01, d + 0.0005, { skip: "-z" });
      } else {
        /* the case: lined at the back in the preset's wood, steel sides, top and floor; the shelves; a line of light at the top */
        F.box(T.wood, x0, 0.1, 0, x1, h, 0.02, { skip: "-z", off: [x0 * 0.6, 0.2] });
        F.box(T.metal, x0, 0.1, 0.02, x0 + 0.012, h, d, { skip: "-z" });
        F.box(T.metal, x1 - 0.012, 0.1, 0.02, x1, h, d, { skip: "-z" });
        F.box(T.metal, x0 + 0.012, 0.1, 0.02, x1 - 0.012, 0.13, d, { skip: "-z" });
        F.box(T.metal, x0 + 0.012, h - 0.03, 0.02, x1 - 0.012, h, d, { skip: "-z" });
        for (const y of [0.78, 1.3, 1.82]) F.box(T.metal, x0 + 0.012, y - 0.01, 0.02, x1 - 0.012, y, d - 0.04);
        F.box(o.strip || "emitN", x0 + 0.05, h - 0.034, d - 0.09, x1 - 0.05, h - 0.03, d - 0.07, { skip: "+y" });
        /* its frame, and the smoked glass in it */
        F.box(T.metal, x0, 0.13, d - 0.018, x1, 0.13 + fr, d);
        F.box(T.metal, x0, h - fr, d - 0.018, x1, h, d);
        F.box(T.metal, x0, 0.13 + fr, d - 0.018, x0 + fr, h - fr, d);
        F.box(T.metal, x1 - fr, 0.13 + fr, d - 0.018, x1, h - fr, d);
        F.box("smokedGlass", x0 + fr, 0.13 + fr, d - 0.012, x1 - fr, h - fr, d - 0.006);
        glassBays.push({ x: (x0 + x1) / 2, w: q.w });
      }
      x = x1;
    }
    F.box("dark", -len / 2, top, 0, len / 2, top + 0.02, d - 0.02, { skip: "-z" });
    if (o.bulk) F.box(o.bulk, -len / 2, top + 0.02, 0, len / 2, H, d, { skip: "-z+y", off: [0.1, 0.2] });
    const r = F.rect(-len / 2, 0, len / 2, d);
    ctx.solid(r.x0, r.z0, r.x1, r.z1, top);
    const s = F.rect(-len / 2 - 0.1, 0, len / 2 + 0.1, d + 0.22);
    ctx.shade(s.x0, s.z0, s.x1, s.z1, 0.5);
    return glassBays;
  };
  /* a hob set flush in a worktop: a slab of black glass, its zones faintly drawn */
  const hob = (b, F, x, z, w, dp, y) => {
    F.box("blackGlass", x - w / 2, y, z - dp / 2, x + w / 2, y + 0.004, z + dp / 2);
    for (const [ox, oz] of [[-w / 4, -dp / 4], [w / 4, -dp / 4], [-w / 4, dp / 4], [w / 4, dp / 4]]) F.box("dark", x + ox - 0.07, y + 0.004, z + oz - 0.07, x + ox + 0.07, y + 0.0045, z + oz + 0.07);
  };

  /* ── what stands about ── */
  /* a vase, a bottle, a bowl: profiles in metres, r then y */
  const VASES = {
    amphora: [[0, 0], [0.05, 0], [0.072, 0.03], [0.09, 0.09], [0.088, 0.16], [0.065, 0.22], [0.04, 0.26], [0.036, 0.29], [0.042, 0.305], [0.036, 0.31], [0.03, 0.31], [0.028, 0.29], [0.03, 0.27]],
    tall:    [[0, 0], [0.045, 0], [0.06, 0.04], [0.064, 0.2], [0.05, 0.36], [0.034, 0.42], [0.034, 0.46], [0.03, 0.46], [0.03, 0.42]],
    round:   [[0, 0], [0.04, 0], [0.085, 0.04], [0.1, 0.1], [0.085, 0.16], [0.05, 0.19], [0.042, 0.2], [0.036, 0.2], [0.04, 0.185]],
    bottle:  [[0, 0], [0.032, 0], [0.034, 0.005], [0.034, 0.17], [0.026, 0.2], [0.012, 0.23], [0.012, 0.26], [0.0, 0.26]],
    bowl:    [[0, 0], [0.06, 0], [0.11, 0.025], [0.15, 0.065], [0.16, 0.08], [0.152, 0.08], [0.142, 0.068], [0.1, 0.035], [0.05, 0.016], [0, 0.016]],
    cup:     [[0, 0], [0.045, 0], [0.06, 0.03], [0.072, 0.11], [0.066, 0.11], [0.055, 0.035], [0, 0.03]],
    /* a tall vessel, flared at the shoulder: sculpture more than vase */
    vessel:  [[0, 0], [0.06, 0], [0.08, 0.06], [0.1, 0.24], [0.115, 0.36], [0.1, 0.44], [0.06, 0.5], [0.05, 0.53], [0.046, 0.53], [0.05, 0.5]],
    /* a cylinder, straight and plain */
    cylinder:[[0, 0], [0.07, 0], [0.07, 0.3], [0.064, 0.3], [0.064, 0.02], [0, 0.02]],
  };
  const vase = (b, mat, x, y, z, kind = "amphora", s = 1) => {
    lathe(b, mat, x, z, VASES[kind].map(([r, h]) => [r * s, y + h * s]), { seg: 22, k: 3 });
  };
  /* a few books lying, or a row standing: covers and the pages' edge */
  const books = (b, F, x, y, z, list, o = {}) => {
    let at = y;
    if (o.standing) {
      let lx = x;
      for (const [w, h, d, mat] of list) {
        F.box(mat, lx, y, z - d / 2, lx + w, y + h, z + d / 2);
        F.box("paper", lx + 0.003, y + 0.004, z + d / 2, lx + w - 0.003, y + h - 0.006, z + d / 2 + 0.001, { skip: "-z" });
        lx += w + 0.002;
      }
      return;
    }
    for (const [w, h, d, mat, turn] of list) {
      const dx = turn || 0;
      F.box(mat, x - w / 2 + dx, at, z - d / 2, x + w / 2 + dx, at + h, z + d / 2);
      F.box("paper", x - w / 2 + dx + 0.006, at + 0.003, z - d / 2 + 0.004, x + w / 2 + dx - 0.004, at + h - 0.003, z + d / 2 - 0.004);
      at += h;
    }
    return at;
  };
  /* a board leaning on the splashback */
  const board = (b, F, x, y, w, h, mat) => {
    F.box(mat, x - w / 2, y, 0.022, x + w / 2, y + h, 0.04);
  };

  /* A plant: a pot, its soil, and leaves — each a long, pointed leaf bent once along its middle, drawn on both sides.
     `kind`: "tree" — an olive in a tall pot, a slim trunk and a crown of small leaves; "bush" — a low pot of broad
     leaves; "branch" — a few bare stems with leaves along them, in a vase. Seeded, so it is the same plant each time. */
  /* a slim rod from p0 to p1, four-sided: a stem, a branch, a leg */
  const rod = (b, mat, p0, p1, r) => {
    const d = norm(sub(p1, p0)), a = Math.abs(d[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
    const s = norm(cross(d, a)), t = norm(cross(d, s));
    const C = [add(scale(s, r), scale(t, r)), add(scale(s, -r), scale(t, r)), add(scale(s, -r), scale(t, -r)), add(scale(s, r), scale(t, -r))];
    for (let i = 0; i < 4; i++) {
      const u = C[i], v = C[(i + 1) % 4], n = norm(add(u, v));
      b.face(mat, add(p0, u), add(p0, v), add(p1, v), add(p1, u), n, (p) => [p[0] * 4, p[1] * 4]);
    }
  };
  const plant = (b, ctx, x, z, kind = "bush", o = {}) => {
    const rnd = prng(o.seed || 7), y0 = o.y || 0, pot = o.pot || "basalt";
    const leaf = (base, dir, len, wid, mat) => {
      const tip = add(base, scale(dir, len));
      const sd = cross(dir, [0, 1, 0]), side = Math.hypot(sd[0], sd[2]) > 1e-4 ? norm(sd) : [1, 0, 0];
      const mid = add(base, scale(dir, len * 0.42));
      const up = norm(cross(side, dir)), fold = scale(up, -wid * 0.18);
      const l = add(add(mid, scale(side, wid / 2)), fold), r = add(add(mid, scale(side, -wid / 2)), fold);
      const n = norm(cross(sub(l, base), sub(tip, base)));
      b.face(mat, base, l, tip, r, n, (p) => [p[0], p[2]]);
      b.face(mat, base, r, tip, l, scale(n, -1), (p) => [p[0], p[2]]);
    };
    if (kind === "tree") {
      const ph = o.potH || 0.46, pr = o.potR || 0.24;
      if (o.potShape === "cylinder") lathe(b, pot, x, z, [[0, y0], [pr, y0], [pr, y0 + ph], [pr - 0.02, y0 + ph], [pr - 0.024, y0 + ph - 0.03]], { seg: 32, k: 3 });
      else lathe(b, pot, x, z, [[0, y0], [pr * 0.82, y0], [pr, y0 + ph * 0.92], [pr, y0 + ph], [pr - 0.02, y0 + ph], [pr - 0.024, y0 + ph - 0.03]], { seg: 28, k: 3 });

  };

  /* ── a sink, built from its measurements ──────────────────────────────────
     A moulded sink is a handful of dimensions: the outline and its corners,
     the rim round the bowls, the divider, the bowls' corners, how far the
     walls step in on their way down, the depth, the radius where wall meets
     floor, the thickness of the moulding, and the drains. A top-mount sink
     adds its deck — the wider rim at the back — and the holes in it. All of
     them come in from the page's data — measured from the supplied
     photographs or, where a photograph taken from above cannot show them,
     estimated and marked as such there. Nothing about the product is
     decided here.

     Millimetres in, metres out. x to the right, y up, z towards the person
     standing in front of it; the top of the rim is y = 0.                 */
  const sinkPlan = (spec) => {
    const e = spec.est, lip = e.lip, rf = e.floorR;
    const [OW, OD] = spec.size, hx = OW / 2, hz = OD / 2;
    /* The photographs show edges where the light turns: the middle of the
       rounded lip at the top of each wall, and the middle of the fillet at
       its foot. The wall itself starts a little further in than the first,
       and would meet the floor a little further out than the second.    */
    const k45 = 1 - Math.SQRT1_2;
    /* the rim: one width all round, or its own on each side — left, right, back, front */
    const rs = Array.isArray(spec.rim) ? spec.rim : [spec.rim, spec.rim, spec.rim, spec.rim];
    const [rL, rR, rB, rF] = rs.map((r) => r + k45 * lip);

    const div = Math.max(0, (spec.divider || 0) - 2 * k45 * lip);

      bowls.push({ x0: -hx + rim, x1: -div / 2, z0: -hz + rim, z1: hz - rim, ox0: -hx, ox1: 0, oc: [0, 1, 1, 0] });
      bowls.push({ x0: div / 2, x1: hx - rim, z0: -hz + rim, z1: hz - rim, ox0: 0, ox1: hx, oc: [1, 0, 0, 1] });
    } else {
      bowls.push({ x0: -hx + rL, x1: hx - rR, z0: -hz + rB, z1: hz - rF, ox0: -hx, ox1: hx, oc: [1, 1, 1, 1] });
    }
    const runX = Math.max(0, spec.runX - k45 * (lip + rf)), runZ = Math.max(0, spec.runZ - k45 * (lip + rf));
    /* the outline's corners, in the order the rings go round: front right, front left, back left, back right */
    const cr = Array.isArray(spec.cornerR) ? spec.cornerR : [spec.cornerR, spec.cornerR];
    const orad = [cr[1], cr[1], cr[0], cr[0]];
    const mount = spec.mount === "top" ? "top" : "under";
    return { hx, hz, rim, rims: [rL, rR, rB, rF], div, bowls, runX, runZ, lip, rf, depth: e.depth, flange: e.flange, wall: e.wall,
      orad, mount, edgeR: mount === "top" ? (e.edgeR || 0) : 0, ledge: spec.ledge || null };
  };

  /* The hole a worktop needs for it. Undermounted: one opening round the
     bowls, set back a few millimetres from their edge so a sliver of the

      r: (spec.bowlR + rv) * MM, h: (spec.counter || 38) * MM, top: false };
  };

  /* A sink as the room is laid out for it before it is built: its size, depth, rim and the cut-out the worktop needs

  const sinkStub = (spec) => {
    const MM = 0.001, PL = sinkPlan(spec);

    const parts = {};
    const part = (name) => parts[name] || (parts[name] = { pos: [], nor: [], uv: [], inner: [], idx: [] });
    /* texture laid on in millimetres, a repeat every 200 mm, from whichever side a face looks */
    const uvOf = (p, n) => {
      const a = Math.abs(n[0]), b = Math.abs(n[1]), c = Math.abs(n[2]);
      return b >= a && b >= c ? [p[0] / 200, p[2] / 200] : a >= c ? [p[2] / 200, p[1] / 200] : [p[0] / 200, p[1] / 200];
    };

       share its points exactly, however each arrived at them, so no pixel can fall between them */
    const snap = (v) => Math.round(v * 1e4) / 1e4;
    const vtx = (P, p, n, inner = -1, uv = null) => {
      const l = Math.hypot(n[0], n[1], n[2]) || 1, nn = [n[0] / l, n[1] / l, n[2] / l];

    const quad = (P, a, b, c, d) => {
      const g = cross(sub(at3(P, c), at3(P, a)), sub(at3(P, d), at3(P, b)));
      const nv = [0, 0, 0]; for (const i of [a, b, c, d]) { nv[0] += P.nor[i * 3]; nv[1] += P.nor[i * 3 + 1]; nv[2] += P.nor[i * 3 + 2]; }
      if (dot(g, nv) < 0) P.idx.push(a, c, b, a, d, c); else P.idx.push(a, b, c, a, c, d);
    };

    const tri = (P, a, b, c) => {
      const g = cross(sub(at3(P, b), at3(P, a)), sub(at3(P, c), at3(P, a)));
      const nv = [0, 0, 0]; for (const i of [a, b, c]) { nv[0] += P.nor[i * 3]; nv[1] += P.nor[i * 3 + 1]; nv[2] += P.nor[i * 3 + 2]; }

    };
    const strip = (P, r0, r1, skip = null) => {
      for (let i = 0; i < r0.length; i++) { if (skip && skip(i)) continue; const j = (i + 1) % r0.length; quad(P, r0[i], r0[j], r1[j], r1[i]); }
    };

    /* A rounded rectangle as a ring of points, always the same number in
       the same places — each corner, then the edge to the next — so any
       two rings stitch together point for point. Each point carries the
       direction it faces outwards.                                       */
    const SEG = 6, NX = 11, NZ = 12;
    const ring = (x0, x1, z0, z1, radii) => {
      const out = [], w = (x1 - x0) / 2, d = (z1 - z0) / 2;
      const cs = [[x1, z1, 0], [x0, z1, 1], [x0, z0, 2], [x1, z0, 3]];
      const cornerAt = (k) => {

        return { r, q, x: cx + (q === 1 || q === 2 ? r : -r), z: cz + (q === 2 || q === 3 ? r : -r) };
      };
      for (let k = 0; k < 4; k++) {
        const C = cornerAt(k);
        for (let i = 0; i <= SEG; i++) {
          const a = (C.q + i / SEG) * Math.PI / 2;
          out.push({ x: C.x + Math.cos(a) * C.r, z: C.z + Math.sin(a) * C.r, hx: Math.cos(a), hz: Math.sin(a) });
        }
        const a1 = out[out.length - 1], C2 = cornerAt((k + 1) % 4), a2 = C2.q * Math.PI / 2;
        const b0 = { x: C2.x + Math.cos(a2) * C2.r, z: C2.z + Math.sin(a2) * C2.r };
        const en = [Math.cos((C.q + 1) * Math.PI / 2), Math.sin((C.q + 1) * Math.PI / 2)];
        const n = k === 0 || k === 2 ? NX : NZ;
        for (let i = 1; i <= n; i++) { const t = i / (n + 1); out.push({ x: lerp(a1.x, b0.x, t), z: lerp(a1.z, b0.z, t), hx: en[0], hz: en[1] }); }
      }
      return out;
    };
    /* a ring placed at a height, each point given its normal by `nf(point)` */
    const put = (P, rg, y, nf, inner = -1) => rg.map((p) => vtx(P, [p.x, y, p.z], nf(p), inner));
    /* the wall leans differently along x and z, so a corner's slope is a blend of the two */
    const slope = (p) => kx * Math.abs(p.hx) + kz * Math.abs(p.hz);
    const UP = () => [0, 1, 0], DOWN = () => [0, -1, 0];

    /* A flat band between two rings (outer, inner) at height y, with round
       holes through it — a deck's tap hole. The quads that would cover a
       hole are left out; the polygon they made is joined to the hole's
       circle instead, both walked round the hole's centre in order of
       angle, a triangle at a time. Returns the holes' rims, for their walls. */
    const bandWithHoles = (P, outer, inner, y, nf, holes, inr = -1) => {
      const O = put(P, outer, y, nf, inr), I = inner;
      const taken = new Set(), rims = [];
      for (const h of holes) {
        const hr = h.d / 2, m = hr + 6;

        const near = [];

          const j = (i + 1) % outer.length;
          const pts = [outer[i], outer[j], at3(P, I[i]), at3(P, I[j])].map((q) => (Array.isArray(q) ? { x: q[0], z: q[2] } : q));
          const x0 = Math.min(...pts.map((q) => q.x)), x1 = Math.max(...pts.map((q) => q.x)), z0 = Math.min(...pts.map((q) => q.z)), z1 = Math.max(...pts.map((q) => q.z));

        for (let i = i0; i <= i1; i++) loop.push(O[i % outer.length]);
        for (let i = i1; i >= i0; i--) loop.push(I[i % outer.length]);

          circ.push(vtx(P, [h.x + Math.cos(a) * hr, y, h.z + Math.sin(a) * hr], nf({ x: h.x, z: h.z, hx: 0, hz: 0 }), inr));
        }
        /* both loops by angle, from the same start, and zipped together */
        const a0 = ang(at3(P, loop[0]));
        const norm2 = (a) => { let d = a - a0; while (d < 0) d += 2 * Math.PI; while (d >= 2 * Math.PI) d -= 2 * Math.PI; return d; };
        const L = loop.map((v) => ({ v, a: norm2(ang(at3(P, v))) })).sort((p, q) => p.a - q.a);
        const C = circ.map((v) => ({ v, a: norm2(ang(at3(P, v))) })).sort((p, q) => p.a - q.a);
        let i = 0, j = 0;
        const nL = L.length, nC = C.length;
        while (i < nL || j < nC) {

          if ((aL <= aC && i < nL) || j >= nC) { tri(P, li.v, lj.v, ci.v); i++; }
          else { tri(P, li.v, cj.v, ci.v); j++; }
        }

      }
      for (let i = 0; i < outer.length; i++) {
        if (taken.has(i)) continue;

    };

    const holeWall = (P, h, hr, y0, y1) => {
      const N = 32, a = [], b = [];

        a.push(vtx(P, [h.x + c * hr, y0, h.z + s * hr], [-c, 0, -s]));
        b.push(vtx(P, [h.x + c * hr, y1, h.z + s * hr], [-c, 0, -s]));
      }
      strip(P, a, b);
    };
    /* a closed upright cylinder: side, top and the face it stands on */
    const cylinder = (P, cx, cz, r, y0, y1, inr = -1, N = 40, uvR = 0) => {
      const s0 = [], s1 = [], t1 = [], t0 = [];
      for (let k = 0; k < N; k++) {
        const a = (k / N) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
        s0.push(vtx(P, [cx + c * r, y0, cz + s * r], [c, 0, s], inr)); s1.push(vtx(P, [cx + c * r, y1, cz + s * r], [c, 0, s], inr));
        const uv = uvR ? [0.5 + c * r / (2 * uvR), 0.5 + s * r / (2 * uvR)] : null;
        t1.push(vtx(P, [cx + c * r, y1, cz + s * r], [0, 1, 0], inr, uv)); t0.push(vtx(P, [cx + c * r, y0, cz + s * r], [0, -1, 0], inr));

      for (let k = 0; k < N; k++) { const j = (k + 1) % N; tri(P, ct, t1[k], t1[j]); tri(P, cb, t0[j], t0[k]); }
    };
    /* a closed slab under a flat polygon (outline points [x, z], in order round it), from y0 up to y1;
       its top is fanned from a point every part of the outline can be seen from */
    const prism = (P, poly, from, y0, y1, inr = -1, sides = null) => {
      const n = poly.length;
      const top = poly.map((q) => vtx(P, [q[0], y1, q[1]], [0, 1, 0], inr)), ct = vtx(P, [from[0], y1, from[1]], [0, 1, 0], inr);
      const bot = poly.map((q) => vtx(P, [q[0], y0, q[1]], [0, -1, 0], inr)), cb = vtx(P, [from[0], y0, from[1]], [0, -1, 0], inr);
      for (let k = 0; k < n; k++) { const j = (k + 1) % n; tri(P, ct, top[k], top[j]); tri(P, cb, bot[j], bot[k]); }
      for (let k = 0; k < n; k++) {
        const j = (k + 1) % n, a = poly[k], b = poly[j], ex = b[0] - a[0], ez = b[1] - a[1], l = Math.hypot(ex, ez);

        /* the side faces outward: away from the point the top was fanned from */
        let nx = ez / l, nz = -ex / l;
        if ((a[0] - from[0]) * nx + (a[1] - from[1]) * nz < 0) { nx = -nx; nz = -nz; }
        const s = [vtx(P, [a[0], y0, a[1]], [nx, 0, nz], inr), vtx(P, [b[0], y0, b[1]], [nx, 0, nz], inr),
          vtx(P, [b[0], y1, b[1]], [nx, 0, nz], inr), vtx(P, [a[0], y1, a[1]], [nx, 0, nz], inr)];
        quad(P, s[0], s[1], s[2], s[3]);
      }
    };

    const body = part("body");
    const single = bowls.length === 1;
    const holes = (spec.holes || []).map((h) => ({ x: h.x, z: h.z, d: h.d }));
    bowls.forEach((B, bi) => {
      const at = (ix, iz, r) => ring(B.x0 + ix, B.x1 - ix, B.z0 + iz, B.z1 - iz, [r, r, r, r]);
      const wx = (B.x1 - B.x0) / 2, wz = (B.z1 - B.z0) / 2;
      const floorR = (ix, iz) => Math.max(0, Math.min(rc, wx - ix, wz - iz));

      /* ── inside: the rounded lip, the leaning walls, the fillet, the floor ── */
      const rings = [];
      for (let i = 0; i <= 5; i++) {
        const t = (i / 5) * Math.PI / 2, s = -lip + lip * Math.sin(t), y = -lip + lip * Math.cos(t);
        rings.push(put(body, at(s, s, rc - s), y, (p) => [-p.hx * Math.sin(t), Math.cos(t) + slope(p) * Math.sin(t), -p.hz * Math.sin(t)], bi));
      }
      const yw = yc - rf * Math.sin(am);                       // where the straight wall hands over to the fillet
      for (let i = 1; i <= 10; i++) {
        const y = lerp(-lip, yw, i / 10);
        rings.push(put(body, at(wallX(y), wallZ(y), rc), y, (p) => [-p.hx, slope(p), -p.hz], bi));
      }
      for (let i = 1; i <= 6; i++) {
        const ph = am + (Math.PI / 2 - am) * (i / 6), y = yc - rf * Math.sin(ph);
        rings.push(put(body, at(scx - rf * Math.cos(ph), scz - rf * Math.cos(ph), rc), y,
          (p) => [-p.hx * Math.cos(ph), Math.sin(ph), -p.hz * Math.cos(ph)], bi));
      }
      /* the floor, closing in on the middle — rings closer together near the walls, where its light changes */
      for (let i = 1; i <= 9; i++) {
        const t = Math.pow(i / 9, 1.5), ix = lerp(scx, wx, t), iz = lerp(scz, wz, t);
        rings.push(put(body, at(ix, iz, floorR(ix, iz)), -depth, UP, bi));
      }
      for (let i = 0; i < rings.length - 1; i++) strip(body, rings[i], rings[i + 1]);

      /* ── the top of the rim (and of the divider), out to this bowl's share of the outline ──
         A top-mount sink's outline is seen, standing on the stone: its top edge is rounded over. */
      const share = ring(B.ox0, B.ox1, -hz, hz, B.oc.map((c, k) => c * orad[k]));
      const e = single ? edgeR : 0;
      const inset = (d) => ring(B.ox0 + d, B.ox1 - d, -hz + d, hz - d, B.oc.map((c, k) => Math.max(0, c * orad[k] - d)));
      const topRing = e > 0 ? inset(e) : share;
      const deck = bandWithHoles(body, topRing, rings[0], 0, UP, single ? holes : []);
      for (const { h, hr } of deck.rims) holeWall(body, h, hr, 0, -flange);
      /* ── the outline's edge: its round, then straight down to the rim's underside
         (not where two shares meet, mid-divider) ── */
      const side = (p) => [p.hx, 0, p.hz], mid = (p) => bowls.length > 1 && Math.abs(p.x) < 1e-6;
      let edgeTop = 0;

        let prev = put(body, topRing, 0, UP);
        for (let k = 1; k <= 5; k++) {
          const ph = (k / 5) * Math.PI / 2, d = e - e * Math.sin(ph), y = -e + e * Math.cos(ph);
          const cur = put(body, inset(d), y, (p) => [p.hx * Math.sin(ph), Math.cos(ph), p.hz * Math.sin(ph)]);
          strip(body, prev, cur);

        }
        edgeTop = -e;
      }
      const e0 = put(body, share, edgeTop, side), e1 = put(body, share, -flange, side);
      for (let i = 0; i < share.length; i++) {
        const j = (i + 1) % share.length;
        if (mid(share[i]) && mid(share[j])) continue;
        const a = share[i], c = share[j];
        if (Math.hypot(a.x - c.x, a.z - c.z) < 1e-9) continue;
        quad(body, e0[i], e0[j], e1[j], e1[i]);
      }

  const angleTo = (from, to) => { let d = to - from; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

  };

    x.lineWidth = 7; x.strokeStyle = "rgba(201,164,106,0.9)"; x.stroke();
    x.fillStyle = "#C9A46A"; x.textAlign = "center"; x.textBaseline = "middle";

    const w = 2048, h = 256, c = canvas(w, h), x = c.getContext("2d");
    x.textAlign = "center"; x.textBaseline = "middle";

    const WIS = isle({ id: "steel", owner: "steelsink", zone: WISL, yaw: -Math.PI / 2, hero: steelHeroIdx, n: 1,
