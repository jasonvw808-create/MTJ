    [class*="md:text-[46px]"]  { font-size: clamp(34px, 4.6vw, 46px); }
  }

  /* Headlines shouldn't drop a single word onto the last line; body copy
     shouldn't leave a widow. Both degrade to normal wrapping where absent. */
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }
  body { font-optical-sizing: auto; }

  input, textarea, select, button { font-family: inherit; letter-spacing: inherit; }
  input::placeholder, textarea::placeholder { font-weight: 400; }
  /* Where you are, when you are using a keyboard. The browser's own ring is
     drawn in near-black, which on the dark ground is all but invisible —
     someone tabbing through the site had no way of telling what was about to
     open. This one is drawn in ink, so it inverts with the theme, and is
     square to match everything else on the page. It appears only for
     keyboard and assistive navigation; a mouse never sees it.            */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid rgb(var(--ink));
    outline-offset: 3px;
    border-radius: 1px;
  }
  /* over a photograph the ink ring can disappear into the image, so the
     hero and the statement bands carry a light one instead. It is fixed
     rather than taken from --bone: a photograph and the support panel are
     dark in both themes, and --bone turns near-black in dark mode, which
     put a black ring on a dark photo exactly where a keyboard user needs
     to see it. This is light mode's bone, so light mode is unchanged.     */
  .on-dark :focus-visible,
  .sup-surface :focus-visible { outline-color: rgb(247 244 238); }

  ::selection { background:rgb(var(--line)); color:rgb(var(--ink)); }

  /* ── THEME TRANSITION ────────────────────────────────────────────────────
     Switching theme is one gesture, so it reads as one: the new theme opens
     out of the button that was pressed, in a circle with a soft edge, so
     each part of the page changes over a moment as the edge passes instead
     of flipping along a hard line. The browser holds a picture of the page
     as it was and shows the page as it now is through the circle (the View
     Transitions API), which is what lets every surface — the bar, cards,
     forms, the footer, an open bag — change in the same movement.

     The circle is paced in JS by how much of the screen has changed, not by
     how far its edge has travelled, so it opens at the same even pace from
     the corner of the header or from half-way down a phone menu.          */
  :root { --theme-fade: 480ms; --theme-ease: cubic-bezier(0.4, 0, 0.2, 1); }

  /* From the moment the theme changes until the switch is over, nothing
     eases on its own: a link, a border or the bar with a colour transition
     of its own would otherwise still be fading out of the old palette as
     the new one is revealed around it. The toggle's sun and moon keep their
     movement; it is part of the switch.                                   */
  :root[data-theme-snap] *:not(.tt-face),
  :root[data-theme-snap] *::before,
  :root[data-theme-snap] *::after { transition: none !important; }

  /* our own animations replace the default cross-fade */
  :root[data-vt="theme"]::view-transition-old(root),
  :root[data-vt="theme"]::view-transition-new(root),
  :root[data-vt="fade"]::view-transition-old(root),
  :root[data-vt="fade"]::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) { z-index: 2; }

  /* The circle: solid to 70% of its radius, then feathered away to nothing
     on an S-shaped falloff (THEME_FEATHER, 0.30, in the script), so the new
     theme spreads out like light from a lamp rather than arriving as a cut
     disc, and each part of the page changes over a moment as it passes. It
     starts at no size at all, so not one frame of the new theme shows
     before the reveal begins.                                            */
  :root[data-vt="theme"]::view-transition-new(root) {
    -webkit-mask-image: radial-gradient(circle closest-side, #000 70%, rgb(0 0 0 / 0.9) 76%, rgb(0 0 0 / 0.66) 82%, rgb(0 0 0 / 0.36) 88%, rgb(0 0 0 / 0.12) 94%, transparent);
            mask-image: radial-gradient(circle closest-side, #000 70%, rgb(0 0 0 / 0.9) 76%, rgb(0 0 0 / 0.66) 82%, rgb(0 0 0 / 0.36) 88%, rgb(0 0 0 / 0.12) 94%, transparent);
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
    -webkit-mask-size: 0 0;
            mask-size: 0 0;
  }

  /* ── MOVING BETWEEN THE TWO HALVES ──────────────────────────────────────
     Crossing between the brand site and the shop is the one navigation on
     this site that changes what kind of place you are in, so it is the one
     that gets a transition. The page you are leaving darkens, blurs and
     settles back a fraction; the page you are arriving at opens from very
     slightly larger and a few pixels to the side, so the movement has a
     direction — inward on the way into the shop, back out on the way home.

     Both halves run on the same view-transition machinery as the theme
     wipe, which is why the root carries `data-vt`: without it the two would
     try to animate the same pseudo-elements.                               */
  :root[data-vt="page"]::view-transition-old(root) {
    animation: page-out 480ms cubic-bezier(0.45, 0, 0.2, 1) both;
    transform-origin: 50% 42%;
  }
  :root[data-vt="page"]::view-transition-new(root) {
    animation: page-in 640ms cubic-bezier(0.16, 1, 0.3, 1) both;
    transform-origin: 50% 42%;
  }
  @keyframes page-out {
    0%   { opacity: 1; transform: scale(1)     translateX(0);
           filter: brightness(1) blur(0px); }
    100% { opacity: 0; transform: scale(0.955) translateX(calc(var(--vt-dir, 1) * -22px));
           filter: brightness(0.5) blur(7px); }
  }
  @keyframes page-in {
    0%   { opacity: 0; transform: scale(1.035) translateX(calc(var(--vt-dir, 1) * 26px)); }
    45%  { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }

  /* Without the API: one scrim over the page carrying the same darkening,
     with the blur and the settle applied to the shell underneath it. */
  .page-veil { position: fixed; inset: 0; z-index: 9997; pointer-events: none;
               background: rgb(var(--bone)); opacity: 0; contain: strict;
               will-change: opacity; }
  .page-leaving  > div { transform: scale(0.97); filter: blur(6px) brightness(0.62);
                         transition: transform 400ms cubic-bezier(0.45,0,0.2,1),
                                     filter 400ms cubic-bezier(0.45,0,0.2,1); }
  .page-entering > div { animation: page-in 640ms cubic-bezier(0.16,1,0.3,1) both; }

  /* Without view transitions (older Safari and Firefox) there is no picture
     of the old page to reveal the new one through, so every themed colour
     eases from one palette to the other together — no circle, but no flash
     and nothing out of step. "quiet" is the same, briefer, for someone who
     has asked for less motion. An attribute rather than a class, so the
     Tailwind CDN never rebuilds its stylesheet over a theme switch.        */
  :root[data-theme-fade="quiet"] { --theme-fade: 200ms; }
  :root[data-theme-fade] *:not(.tt-face),
  :root[data-theme-fade] *::before,
  :root[data-theme-fade] *::after {
    transition: background-color var(--theme-fade) var(--theme-ease),
                border-color     var(--theme-fade) var(--theme-ease),
                outline-color    var(--theme-fade) var(--theme-ease),
                color            var(--theme-fade) var(--theme-ease),
                fill             var(--theme-fade) var(--theme-ease),
                stroke           var(--theme-fade) var(--theme-ease),
                box-shadow       var(--theme-fade) var(--theme-ease),
                filter           var(--theme-fade) var(--theme-ease) !important;
  }

  /* ── CHANGING LANGUAGE ──────────────────────────────────────────────────
     Every word on the page is replaced at once, which without any cover
     reads as a flicker — the eye catches the swap rather than the result.
     A short dip and return hides the moment the text changes and says, in
     the least possible amount of motion, that something deliberate
     happened. It is 260ms end to end, a third of the theme wipe: this is
     a preference being applied, not a place being entered.

     The dip runs on the shell, so the bar, the page and the footer all
     change together on one curve rather than in three stages. Nothing
     moves and nothing reflows — the layout is identical in both
     languages, only the words in it are not.                             */
  :root[data-lang="swap"] .lang-fade {
    animation: lang-swap 260ms cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes lang-swap {
    0%   { opacity: 1;    }
    46%  { opacity: 0.28; }
    100% { opacity: 1;    }
  }

  /* The toggle's sun and moon share one square and turn like a dial. The
     one leaving turns away and shrinks a little, quickly; the one arriving
     follows a beat behind and settles. Each waits turned to its own side,
     so the two always turn the same way — clockwise into dark, back again
     into light — and the pair finishes with the reveal, at about 600ms.
     It is driven by the theme on the page rather than by the app, so it
     turns in the very frame the reveal starts.                            */
  .tt-face { position: absolute; inset: 0; opacity: 0;
             transform: rotate(var(--tt-turn)) scale(0.7);
             transition: opacity 180ms cubic-bezier(0.4, 0, 1, 1),
                         transform 240ms cubic-bezier(0.4, 0, 1, 1); }
  .tt-sun  { --tt-turn: -40deg; }
  .tt-moon { --tt-turn: 40deg; }
  :root:not([data-theme="dark"]) .tt-moon,
  :root[data-theme="dark"] .tt-sun {
    opacity: 1; transform: none;
    transition: opacity 320ms cubic-bezier(0.16, 1, 0.3, 1) 140ms,
                transform 460ms cubic-bezier(0.16, 1, 0.3, 1) 120ms; }

  /* The logo is drawn in ink on light grounds and in light on dark ones.
     Both are on the page and the theme picks, so the right one is already
     in place in the first frame of a switch rather than swapped in after. */
  :root:not([data-theme="dark"]) .logo-light,
  :root[data-theme="dark"] .logo-ink { display: none; }

  :root[data-theme="dark"] img:not(.no-dim) { filter: brightness(.88) contrast(1.02); }
  :root[data-theme="dark"] .ph-fallback     { filter: brightness(.3) saturate(.5); }
  :root[data-theme="dark"] .grain::before   { filter: invert(1); opacity: .045; }

  /* The previous mark needed a dark plate to stay legible; this one is drawn
     in ink or in light to suit the ground, so no plate is required. */

  .u { position:relative; display:inline-block; }
  .u::after { content:''; position:absolute; left:0; bottom:-3px; height:1px; width:100%;
    background:currentColor; transform:scaleX(0); transform-origin:left center;
    transition:transform 240ms cubic-bezier(0.16,1,0.3,1); }
  .u:hover::after, .u.is-on::after { transform:scaleX(1); }

  .u-static { position:relative; display:inline-block; padding-bottom:3px; box-shadow:inset 0 -1px 0 currentColor; }
  .u-static::after { content:''; position:absolute; left:0; bottom:0; height:1px; width:100%; background:currentColor;
    transform:scaleX(0); transform-origin:left center; opacity:.5;
    transition:transform 500ms cubic-bezier(0.16,1,0.3,1); }
  .u-static:hover::after { transform:scaleX(1); }


  /* ── MOTION ──────────────────────────────────────────────────────────────
     One choreography, used by every section, so moving from one to the next
     feels like the same hand at work: the small type arrives, the headline
     comes up from behind its own baseline, the copy settles beneath it, the
     photograph develops on its plate, and anything in a row follows one
     step behind its neighbour. Every movement is an opacity or a translate
     — the compositor carries them, and nothing ever moves the layout.

     Nothing is hidden until the script has said motion can run (it sets
     `data-motion` on the root). Reduced motion, a browser without an
     IntersectionObserver, a script that fails, printing, and keyboard focus
     arriving inside a block that has not yet been revealed all take the
     same road: the content is simply there.

     These are CSS animations rather than transitions on purpose. A
     transition declared here would replace the hover transitions the
     swatches, tiles and buttons already carry; an animation runs alongside
     them and, once finished, lets go of the element entirely.              */
  :root {
    --m-text: 700ms;                       /* a block or a line of copy      */
    --m-rise: 800ms;                       /* a headline off its baseline    */
    --m-img:  800ms;                       /* a photograph developing        */
    --m-step: 80ms;                        /* between items in a row         */
    --m-lift: 16px;                        /* how far anything travels       */
    --m-ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes m-up   { from { opacity: 0; translate: 0 var(--m-lift); } to { opacity: 1; translate: none; } }
  @keyframes m-rise { from { translate: 0 102%; } to { translate: none; } }
  @keyframes m-dev  { from { opacity: 0; scale: 1.04; } to { opacity: 1; scale: 1; } }

  /* a headline arriving from under its own line, one clause at a time */
  .rise { display:block; overflow:hidden; }
  .rise > span { display:block; }
  .rise:nth-child(2) { --m-line: 90ms; }
  .rise:nth-child(3) { --m-line: 180ms; }

  /* Position in a sequence. A `cascade` numbers its own children; `rv-N`
     places a single element by hand. Each timed element works out its own
     start from the block's delay, so a headline rising inside the third
     item of a cascade starts with that item and not before it.            */
  .cascade > :nth-child(1) { --m-i: 0; }
  .cascade > :nth-child(2) { --m-i: 1; } .cascade > :nth-child(3) { --m-i: 2; }
  .cascade > :nth-child(4) { --m-i: 3; } .cascade > :nth-child(5) { --m-i: 4; }
  .cascade > :nth-child(6) { --m-i: 5; } .cascade > :nth-child(7) { --m-i: 6; }
  .cascade > :nth-child(8) { --m-i: 7; } .cascade > :nth-child(n+9) { --m-i: 8; }
  .rv-1 { --m-i: 1; } .rv-2 { --m-i: 2; } .rv-3 { --m-i: 3; } .rv-4 { --m-i: 4; }
  .rv-5 { --m-i: 5; } .rv-6 { --m-i: 6; } .rv-7 { --m-i: 7; } .rv-8 { --m-i: 8; }
  .reveal { --m-d: var(--m-rd, 0ms); }
  .cascade > *, .rv { --m-d: calc(var(--m-rd, 0ms) + min(var(--m-i, 0), 8) * var(--m-step)); }

  @media screen and (prefers-reduced-motion: no-preference) {
    /* waiting to be seen */
    :root[data-motion="on"] .reveal[data-reveal="wait"]:not(.still):not(:focus-within),
    :root[data-motion="on"] .reveal[data-reveal="wait"]:not(:focus-within) .rv,
    :root[data-motion="on"] .reveal[data-reveal="wait"]:not(:focus-within).cascade > *,
    :root[data-motion="on"] .reveal[data-reveal="wait"]:not(:focus-within) .cascade > *,
    :root[data-motion="on"] .media[data-reveal="wait"]:not(:focus-within) img,
    :root[data-motion="on"] .media[data-reveal="wait"]:not(:focus-within) .ph-fallback { opacity: 0; }
    :root[data-motion="on"] .reveal[data-reveal="wait"]:not(:focus-within) .rise > span { translate: 0 102%; }

    /* Seen: a block, an item, a line. Each rule stops at the edge of any
       block still waiting inside this one, so an inner block keeps its own
       timing, and all of it stops once the block is "done" — copy that is
       added later (a form opened, a room changed) is simply there.        */
    :root[data-motion="on"] .reveal[data-reveal="in"]:not(.still),
    :root[data-motion="on"] .reveal[data-reveal="in"] .rv:not(.reveal[data-reveal="wait"] *),
    :root[data-motion="on"] .reveal[data-reveal="in"].cascade > *,
    :root[data-motion="on"] .reveal[data-reveal="in"] .cascade > *:not(.reveal[data-reveal="wait"] *) {
      animation: m-up var(--m-text) var(--m-ease) var(--m-d, 0ms) backwards; }
    :root[data-motion="on"] .reveal[data-reveal="in"] .rise > span:not(.reveal[data-reveal="wait"] *) {
      animation: m-rise var(--m-rise) var(--m-ease) calc(var(--m-d, 0ms) + var(--m-line, 0ms)) backwards; }

    /* A photograph develops once it is both in view and loaded — never
       before it has arrived, which would fade an empty frame and then let
       the picture pop in on top. If the image is slow, its plate holds the
       space in the meantime; if the load signal never comes, the picture
       simply appears, unanimated, the moment the browser has it. A picture
       that arrives later (the next room in the In Situ view) develops in
       the same way, which is the only transition a change of picture gets. */
    :root[data-motion="on"] .media[data-reveal="in"] img[data-ready],
    :root[data-motion="on"] .media[data-reveal="in"] .ph-fallback {
      animation: m-dev var(--m-img) var(--m-ease) var(--m-md, 0ms) backwards; }
    /* the hero keeps its slow drift underneath its arrival */
    :root[data-motion="on"] .media[data-reveal="in"] img.drift[data-ready] {
      animation: m-dev var(--m-img) var(--m-ease) var(--m-md, 0ms) backwards,
                 drift 30s cubic-bezier(0.4,0,0.2,1) infinite alternate; }
  }
  .media { overflow: hidden; }

  /* the picture uncovers itself rather than fading on */
  .frame { overflow:hidden; }
  .frame > img, .frame > .ph-fallback {
    transform:scale(1.08); transition:transform 1600ms cubic-bezier(0.16,1,0.3,1); }
  .reveal[data-reveal="in"] .frame > img, .reveal[data-reveal="done"] .frame > img, .frame.in > img,
  .reveal[data-reveal="in"] .frame > .ph-fallback, .reveal[data-reveal="done"] .frame > .ph-fallback,
  .frame.in > .ph-fallback { transform:none; }

  /* A product card's "Add to Cart" waits under the picture until a mouse
     moves over the card. A touch screen has no hover to bring it up, so on
     a tablet it would never be seen; there it simply stays in view, the
     way it already does on a phone. A laptop with a mouse or trackpad is
     unchanged.                                                             */
  @media (hover: none) {
    :root [data-card-add] { opacity: 1; transform: none; }
  }

  /* a slow push in on hover, for cards and editorial tiles */
  .zoom > img, .zoom > .ph-fallback {
    transition:transform 1400ms cubic-bezier(0.16,1,0.3,1); }
  .group:hover .zoom > img, .group:hover .zoom > .ph-fallback { transform:scale(1.045); }

  /* parallax — the offset is written to a custom property by JS */
  .par { will-change:transform; transform:translate3d(0, var(--par, 0px), 0); }

  /* the hero's scroll cue: a short mark running down a hairline */
  @keyframes scroll-tick { 0% { transform:translateY(-14px); }
                          60%,100% { transform:translateY(38px); } }
  .scroll-tick { animation:scroll-tick 2.8s cubic-bezier(0.6,0,0.3,1) infinite; }

  .no-bar { scrollbar-width:none; -ms-overflow-style:none; }
  .no-bar::-webkit-scrollbar { display:none; }

  @keyframes drift { from { transform:scale(1.02) translate3d(0,0,0); } to { transform:scale(1.12) translate3d(0,-1.5%,0); } }
  .drift { animation:drift 30s cubic-bezier(0.4,0,0.2,1) infinite alternate; }

  .grain::before { content:''; position:absolute; inset:0; pointer-events:none; opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }

  mark { background: rgb(var(--accent) / .18); color: inherit; }

  /* ── CUSTOMER SERVICE ──────────────────────────────────────────────────
     The support panel is the site's one deliberate exception to flat, square
     corners: it floats above the page, so it earns a radius and a soft shadow.
     Its surface is dark in both themes — in light mode it echoes the logo
     plate, in dark mode it sits one step above the ground.                 */
  :root {
    --sup-bg: 27 25 23;
    --sup-shadow: 0 24px 60px -18px rgba(26,26,26,.42), 0 4px 14px rgba(26,26,26,.16);
  }
  :root[data-theme="dark"] {
    --sup-bg: 44 40 36;
    --sup-shadow: 0 24px 60px -18px rgba(0,0,0,.78), 0 4px 14px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sup-bg: 44 40 36;
      --sup-shadow: 0 24px 60px -18px rgba(0,0,0,.78), 0 4px 14px rgba(0,0,0,.5);
    }
  }
  .sup-surface { background: rgb(var(--sup-bg)); box-shadow: var(--sup-shadow); }

  /* the mascot breathes — slow enough to read as alive, not as motion */
  @keyframes breathe {
    0%, 100% { transform: translateY(0) rotate(-1.2deg); }
    50%      { transform: translateY(-6px) rotate(1.2deg); }
  }
  .mascot { animation: breathe 4.6s ease-in-out infinite; transform-origin: 50% 100%; }

  @keyframes sup-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .45; transform: scale(.82); }
  }
  .sup-dot { animation: sup-pulse 2.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .drift, .mascot, .sup-dot, .scroll-tick { animation:none; }
    .rise > span, .frame > img, .frame > .ph-fallback { transform:none !important; }
    .par { transform:none !important; }
    /* the motion layer only ever uses opacity, translate and scale — so
       those are what this resets, and an element's own transform (the
       In Situ markers centre themselves with one) is left exactly as is */
    .reveal, .reveal .rv, .reveal .cascade > *, .reveal.cascade > *, .rise > span, .media img, .media .ph-fallback {
      opacity:1 !important; translate:none !important; scale:none !important; animation:none !important; }
    * { transition-duration:1ms !important; }
    .tt-face { transform: none !important; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
    .page-veil { display: none; }
    .page-leaving > div, .page-entering > div { transform: none !important;
      filter: none !important; animation: none !important; }
    :root[data-lang="swap"] .lang-fade { animation: none !important; opacity: 1 !important; }
  }

  /* ═══ VIRTUAL SHOWROOM ═════════════════════════════════════════════════
     The stage is dark in either theme — it is a room with the lights kept
     low — so it carries the dark palette itself, and everything inside it
     (the way in, the controls, the product panel) is drawn from those same
     tokens. Every state is an attribute on the stage rather than a class,
     so walking about never asks the stylesheet to rebuild.               */
  .vs-stage {
    --bone: 27 25 23; --shell: 35 32 29; --concrete: 44 40 36;
    --ink: 241 234 222; --mute: 178 169 156; --line: 64 58 52; --accent: 201 172 128;
    --vs-ease: cubic-bezier(0.16, 1, 0.3, 1);
    position: relative; isolation: isolate; overflow: hidden;
    height: clamp(600px, calc(100vh - 112px), 920px);
    background: #1B1917; color: rgb(var(--ink));
  }
  .vs-stage [hidden] { display: none !important; }
  .vs-stage[data-immersive="true"] { position: fixed; inset: 0; height: auto; z-index: 90; }
  /* nothing behind a full-screen room needs painting — only the room, and the shop's own confirmations */
  :root[data-vs="immersive"] body { visibility: hidden; }
  :root[data-vs="immersive"] .vs-stage, :root[data-vs="immersive"] [aria-live="polite"].fixed { visibility: visible; }
  .vs-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
  .vs-canvas:active { cursor: grabbing; }
  .vs-stage[data-locked="true"] .vs-canvas { cursor: none; }
  .vs-stage[data-immersive="false"] .vs-canvas { pointer-events: none; }
  .vs-shade { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 95% at 50% 45%, transparent 58%, rgb(0 0 0 / 0.42)); }
  .vs-stage :focus-visible { outline: 1px solid rgb(var(--accent)); outline-offset: 3px; }

  /* the way in */
  .vs-intro { position: absolute; inset: 0; z-index: 2; display: flex; align-items: flex-end;
